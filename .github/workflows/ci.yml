name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# Read-only token for every job; no job needs more. `pull_request` (not `pull_request_target`): pull requests from
# forks run without secrets.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# The checks of scripts/validate.sh run as separate jobs side by side (static, unit test shards, integration, e2e,
# worker-switch, linux-smoke), so the run takes as long as the slowest job instead of the sum. `ci-ok` sums them up into one check.
# Runners are pinned to ubuntu-24.04 (ubuntu-latest moves to Ubuntu 26 from 2026-10-19); move deliberately, with the
# Playwright system libraries and the pg client wrappers checked on the new image.
#
# What runs (gates add up for mixed changes; anything not recognised as documentation, and everything under tests/,
# src/ and public/, counts as code):
#   docs-only PR        changes (classification + documentation link check), ci-docs, static (+ jobspy), unit
#                       (the unit tests read the documentation and the fixtures)
#   code PR             the above plus integration (shuffled file order), worker-switch, e2e, linux-smoke
#   deploy-side PR      the above plus upgrade-transition (scripts/ops/, src/ai-worker/, compose.yaml, Dockerfile changed)
#   toolchain PR        everything, including default-order integration and upgrade-transition
#   push to main        always everything, whatever the pushed commits touch; integration also runs in default order
#   manual run          everything
jobs:
  # Decides which checks run, and checks the relative links of the documentation for every change.
  # Every path that is not documentation (scripts, config, CI) counts as code.
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      code: ${{ steps.diff.outputs.code }}
      full: ${{ steps.diff.outputs.full }}
      transition: ${{ steps.diff.outputs.transition }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 5
        with:
          fetch-depth: 0
      - name: Classify the change
        id: diff
        timeout-minutes: 2
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          # Only a pull request is classified. A push to main is always checked in full (the commits on main are what gets
          # deployed, and a documentation commit must not leave a run that checked nothing), and so is a manual run.
          if [[ "$EVENT" != pull_request ]]; then
            printf 'code=true\nfull=true\ntransition=true\n' >> "$GITHUB_OUTPUT"
            echo "product checks: true, full: true, transition: true"
            exit 0
          fi
          # Documentation: *.md / *.html / images, anywhere except under tests/, src/ and public/ (the tests read their
          # fixtures, among them HTML files; the app ships its own HTML, SVG and images). Everything else is code:
          # scripts, YAML, Dockerfiles, workflows.
          docs_re='\.(md|html|png|jpe?g|svg|gif)$'
          # Fails the job (and with it ci-ok) when the diff cannot be computed: no silent "nothing changed".
          changed=$(git diff --name-only --no-renames "$PR_BASE...$PR_HEAD")
          echo "$changed"
          code=false
          if grep -vE "$docs_re" <<< "$changed" | grep -q .; then code=true; fi
          if grep -qE '^(tests|src|public)/' <<< "$changed"; then code=true; fi
          # The ai-worker's move between release directories (upgrade-transition) only when the deploy side changed.
          transition=false
          if grep -qE '^(scripts/ops/|src/ai-worker/|tests/transition/|tests/ops/sim/)|^(compose\.yaml|Dockerfile)$' <<< "$changed"; then transition=true; fi
          # Dependency and toolchain inputs can affect every suite, including historical upgrades. Keep this rule here;
          # tests/ci-classifier.test.ts executes this script with the same newline-separated diff format.
          full=false
          if grep -qE '^(package\.json|pnpm-lock\.yaml|pnpm-workspace\.yaml|vitest[^/]*\.ts|playwright[^/]*\.ts|\.nvmrc|\.node-version)$|^\.github/' <<< "$changed"; then
            code=true
            full=true
            transition=true
          fi
          printf 'code=%s\nfull=%s\ntransition=%s\n' "$code" "$full" "$transition" >> "$GITHUB_OUTPUT"
          echo "product checks: $code, full: $full, transition: $transition"
      - name: Documentation links
        timeout-minutes: 2
        run: node scripts/check-doc-links.mjs

  # The CI documentation (docs/ci.md, docs/ci.zh.md) must list exactly the jobs and steps of the workflows. Runs for every
  # change, documentation-only ones included (deleting a heading of docs/ci.md is a documentation-only change).
  ci-docs:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 5
      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        timeout-minutes: 5
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        timeout-minutes: 5
        with:
          # check-latest: the runner's toolcache can lag a Node security release behind engines.node.
          node-version: "22"
          check-latest: true
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install dependencies
        timeout-minutes: 8
        run: pnpm install --frozen-lockfile
      - name: CI documentation matches the workflows
        timeout-minutes: 2
        run: pnpm ci:docs-check

  # Lint, typecheck, config check, runner bundle, migration drift, and the jobspy sidecar tests (short ones share a job).
  # Runs for every change.
  static:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 5
      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        timeout-minutes: 5
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        timeout-minutes: 5
        with:
          node-version: "22"
          check-latest: true
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install dependencies
        timeout-minutes: 8
        run: pnpm install --frozen-lockfile
      - name: I18n catalog (messages valid, generated files current)
        timeout-minutes: 3
        run: pnpm i18n:check
      - name: Lint
        timeout-minutes: 8
        run: pnpm lint
      - name: Typecheck
        timeout-minutes: 8
        run: pnpm typecheck
      - name: Config check
        timeout-minutes: 5
        run: pnpm config:check
      - name: Shell script syntax
        timeout-minutes: 2
        run: for f in scripts/*.sh scripts/ops/*.sh scripts/ops/lib/*.sh tests/ops/*.sh tests/ops/proc-lib/*.sh; do bash -n "$f"; done
      # scripts/ops/lib/proc.sh (process groups, signals, exit codes of the deploy scripts) under the two bash versions it
      # must work with: 3.2 (macOS /bin/bash) and 5.2, in the official images pinned by digest. Those images are alpine with
      # busybox; tests/ops/proc-lib/cases.sh needs only bash, sh, uname, sleep (with 0.05), cat, tr, grep, mktemp, rm, seq
      # and a readable /proc, checks them first and fails (never skips) when one is missing. The pseudo-terminal and real
      # pnpm cases run in the unit job (tests/ops/proc-lib.test.ts).
      - name: Process library cases (bash 3.2)
        timeout-minutes: 5
        run: docker run --rm -v "$PWD":/w -w /w bash:3.2@sha256:0fd7cb8499c63a3c9345e7088a9cd83bb69f6e895e83833859aff838a0312091 bash tests/ops/proc-lib/cases.sh
      - name: Process library cases (bash 5.2)
        timeout-minutes: 5
        run: docker run --rm -v "$PWD":/w -w /w bash:5.2@sha256:a54fb4422b18f05dd3107c36f39d67b26334fda7ec89f4126052b45e228e2f15 bash tests/ops/proc-lib/cases.sh
      # The runner ships as an esbuild bundle (Dockerfile runner target); the e2e job uses a stand-in, so build it here.
      - name: Runner bundle
        timeout-minutes: 5
        run: pnpm build:runner
      # The schema in src/lib/db/schema.ts must match the committed migrations: generating again must change nothing.
      - name: Migration drift
        timeout-minutes: 5
        run: |
          pnpm exec drizzle-kit generate < /dev/null
          if [[ -n "$(git status --porcelain -- drizzle)" ]]; then
            git status --porcelain -- drizzle
            echo "::error::src/lib/db/schema.ts and drizzle/ disagree: run 'pnpm db:generate' and commit the migration"; exit 1
          fi
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        timeout-minutes: 5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: jobspy/requirements*.txt
      - name: Install jobspy sidecar dependencies
        timeout-minutes: 8
        working-directory: jobspy
        run: python -m pip install -r requirements-dev.txt
      - name: Jobspy sidecar tests
        timeout-minutes: 10
        working-directory: jobspy
        run: python -m pytest -q

  # The unit suite takes ~4 min in one go: Vitest splits its files over the shards. Runs for every
  # change: it reads the documentation (link targets, picture sizes) and the fixtures.
  unit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    name: unit (${{ matrix.shard }}/2)
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 5
      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        timeout-minutes: 5
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        timeout-minutes: 5
        with:
          node-version: "22"
          check-latest: true
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install dependencies
        timeout-minutes: 8
        run: pnpm install --frozen-lockfile
      - name: Unit tests
        timeout-minutes: 12
        run: pnpm test --shard=${{ matrix.shard }}/2

  integration:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    # Default and shuffled orders stay sequential; worker switch tests run in their own job below.
    timeout-minutes: 45
    env:
      PG_DUMP_PATH: ${{ github.workspace }}/../pgbin/pg_dump
      PG_RESTORE_PATH: ${{ github.workspace }}/../pgbin/pg_restore
      # The real dump/restore tests fail instead of skipping when the client tools are missing.
      REQUIRE_PG_TOOLS: "1"
      # Throwaway service container; each run creates and drops its own uniquely named database.
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 5
      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        timeout-minutes: 5
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        timeout-minutes: 5
        with:
          node-version: "22"
          check-latest: true
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install dependencies
        timeout-minutes: 8
        run: pnpm install --frozen-lockfile
      # The backup tests run the real pg_dump / pg_restore, whose major version must match the postgres:17 service.
      # They come from the postgres:17 image (already pulled for the service) instead of apt.postgresql.org, which once
      # hung this step for an hour. The wrappers run the tool in a --network host container, so localhost:5432 works.
      - name: Provide PostgreSQL 17 client tools
        timeout-minutes: 5
        run: |
          mkdir -p "$(dirname "$PG_DUMP_PATH")"
          ln -sf "$GITHUB_WORKSPACE/scripts/ops/pg-docker.sh" "$PG_DUMP_PATH"
          ln -sf "$GITHUB_WORKSPACE/scripts/ops/pg-docker.sh" "$PG_RESTORE_PATH"
          "$PG_DUMP_PATH" --version
          "$PG_RESTORE_PATH" --version
      # Main, manual and toolchain runs use the default order too; other pull requests use the shuffled order only.
      # Re-run a failure locally with
      # `pnpm test:integration --sequence.shuffle.files --sequence.seed=<seed>`.
      - name: Integration tests (default order)
        if: needs.changes.outputs.full == 'true'
        # A stalled run once sat here silently for over an hour; fail early and name the file that hangs.
        timeout-minutes: 15
        run: pnpm test:integration --reporter=verbose --exclude "tests/integration/ai-worker-swap.test.ts" --exclude "tests/integration/uninstall-ai-worker.test.ts"
      - name: Integration tests (shuffled file order)
        timeout-minutes: 15
        run: |
          seed=$((RANDOM * 32768 + RANDOM))
          echo "::notice::integration file order seed: $seed"
          pnpm test:integration --reporter=verbose --sequence.shuffle.files --sequence.seed="$seed" \
            --exclude "tests/integration/ai-worker-swap.test.ts" --exclude "tests/integration/uninstall-ai-worker.test.ts"
      # engines.node allows Node 22.23.4 and later 22.x: the host ai-worker's release guard needs the synchronous module
      # hooks, which tsx only takes from 22.22.3 on; 22.23.4 is the floor with the security fixes of the 2026-10-21 Node
      # release. The Node above is the newest 22.x; the lowest allowed one is checked here, on a release directory built
      # by scripts/ops/prepare-release.sh. Last steps of the job, so no switch back.
      - name: Set up the lowest Node.js of engines.node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        timeout-minutes: 5
        with:
          node-version: "22.23.4"
      - name: Load a release module with the lowest Node.js
        timeout-minutes: 5
        run: |
          node --version
          root="$(mktemp -d)"
          [[ -n "$root" && -d "$root" ]] || exit 1
          git clone -q --shared "$GITHUB_WORKSPACE" "$root/main"
          release="$(bash scripts/ops/prepare-release.sh "$(git rev-parse HEAD)" --root "$root/main" --offline)"
          # from the release directory, as the service runs it (tsx reads the path aliases from its tsconfig.json)
          rc=0
          (cd "$release" && node --import "$release/src/ai-worker/release-guard.mjs" --import "$release/node_modules/tsx/dist/loader.mjs" \
            --input-type=module -e "await import('$release/src/lib/config/paths.ts')") 2> "$root/stderr.txt" || rc=$?
          cat "$root/stderr.txt"
          if [[ "$rc" -ne 0 ]]; then echo "::error::loading a release module with Node $(node --version) exited $rc"; exit 1; fi
          if grep -q "module.register called" "$root/stderr.txt"; then echo "::error::tsx took the module.register path"; exit 1; fi

  # Each manager runs once in an independent process. No path gating: every code change exercises both.
  worker-switch:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      PG_DUMP_PATH: ${{ github.workspace }}/../pgbin/pg_dump
      PG_RESTORE_PATH: ${{ github.workspace }}/../pgbin/pg_restore
      # The real dump/restore tests fail instead of skipping when the client tools are missing.
      REQUIRE_PG_TOOLS: "1"
      # Throwaway service container; each run creates and drops its own uniquely named database.
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 5
      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        timeout-minutes: 5
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        timeout-minutes: 5
        with:
          node-version: "22"
          check-latest: true
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install dependencies
        timeout-minutes: 8
        run: pnpm install --frozen-lockfile
      # The backup tests run the real pg_dump / pg_restore, whose major version must match the postgres:17 service.
      # They come from the postgres:17 image (already pulled for the service) instead of apt.postgresql.org, which once
      # hung this step for an hour. The wrappers run the tool in a --network host container, so localhost:5432 works.
      - name: Provide PostgreSQL 17 client tools
        timeout-minutes: 5
        run: |
          mkdir -p "$(dirname "$PG_DUMP_PATH")"
          ln -sf "$GITHUB_WORKSPACE/scripts/ops/pg-docker.sh" "$PG_DUMP_PATH"
          ln -sf "$GITHUB_WORKSPACE/scripts/ops/pg-docker.sh" "$PG_RESTORE_PATH"
          "$PG_DUMP_PATH" --version
          "$PG_RESTORE_PATH" --version
      # Separate global-setup databases, isolated roles and mkdtemp simulator state; no listening test ports.
      - name: Start worker switch shards
        timeout-minutes: 2
        run: |
          state="$(mktemp -d "$RUNNER_TEMP/worker-switch.XXXXXX")"
          echo "WORKER_SWITCH_STATE=$state" >> "$GITHUB_ENV"
          date +%s > "$state/started"
          # Job control gives each wrapper its own process group, including the command's descendants.
          # Cancellation forwards TERM to the whole group before the final cleanup step.
          stop_launchers() {
            trap '' INT TERM HUP
            for file in "$state/"*.pid; do
              [[ -f "$file" ]] || continue
              pid="$(cat "$file")"
              [[ "$pid" =~ ^[1-9][0-9]*$ ]] && { kill -TERM -- "-$pid" 2>/dev/null || true; }
            done
          }
          trap 'stop_launchers; exit 130' INT
          trap 'stop_launchers; exit 143' TERM
          trap 'stop_launchers; exit 129' HUP
          df -h
          free -h
          for shard in systemd launchd; do
            set -m
            SWAP_MANAGERS="$shard" bash -c '
              set -uo pipefail
              prefix=$1; shift
              printf "%s\n" "$$" > "$prefix.pid.child.tmp"
              mv "$prefix.pid.child.tmp" "$prefix.pid"
              # The whole group receives TERM. Keep the wrapper alive until its child has finished cleanup.
              trap ":" INT TERM HUP
              finish() { rc=$?; printf "%s\n" "$rc" > "$prefix.exit.tmp"; mv "$prefix.exit.tmp" "$prefix.exit"; }
              trap finish EXIT
              "$@" & child=$!
              # Poll before wait so a signal cannot replace the child status with an interrupted-wait status.
              while kill -0 "$child" 2>/dev/null; do sleep 1 || true; done
              rc=0; wait "$child" || rc=$?
              exit "$rc"
            ' _ "$state/$shard" pnpm test:integration --reporter=verbose tests/integration/ai-worker-swap.test.ts tests/integration/uninstall-ai-worker.test.ts </dev/null > "$state/$shard.log" 2>&1 &
            printf '%s\n' "$!" > "$state/$shard.pid.launch.tmp"
            mv "$state/$shard.pid.launch.tmp" "$state/$shard.pid"
            set +m
          done
      - name: Worker switch (systemd)
        if: ${{ !cancelled() }}
        timeout-minutes: 25
        run: |
          resources() {
            df -h
            free -h
          }
          resources
          trap 'resources || true' EXIT
          state="${WORKER_SWITCH_STATE:?The launcher did not publish its state directory}"
          prefix="$state/systemd"
          fail_wait() {
            [[ ! -f "$prefix.log" ]] || cat "$prefix.log"
            echo "::error::systemd: $*"
            exit 1
          }
          [[ -f "$prefix.pid" ]] || fail_wait "missing process id"
          pid="$(cat "$prefix.pid")"
          [[ "$pid" =~ ^[1-9][0-9]*$ ]] || fail_wait "invalid process id"
          # Actions sends INT before TERM on cancel; forward TERM, which background bash children can trap.
          forward_signal() { kill -TERM -- "-$pid" 2>/dev/null || true; exit "$1"; }
          trap 'forward_signal 130' INT
          trap 'forward_signal 143' TERM
          trap 'forward_signal 129' HUP
          # An absolute deadline starts at launch, so the second wait never gets a fresh execution budget.
          deadline=$(( $(cat "$state/started") + 24 * 60 ))
          sample=$((SECONDS + 60))
          while [[ ! -f "$prefix.exit" ]]; do
            if ! kill -0 "$pid" 2>/dev/null; then
              # The wrapper may have published status between the file check and the liveness check.
              [[ ! -f "$prefix.exit" ]] || break
              fail_wait "process ended without an exit-code file"
            fi
            (( $(date +%s) < deadline )) || fail_wait "timed out without an exit-code file"
            if (( SECONDS >= sample )); then resources; sample=$((SECONDS + 60)); fi
            sleep 2
          done
          rc="$(cat "$prefix.exit")"
          [[ "$rc" == 0 ]] || fail_wait "exit code $rc"
          tail -n 100 "$prefix.log"
      - name: Worker switch (launchd)
        if: ${{ !cancelled() }}
        timeout-minutes: 25
        run: |
          resources() {
            df -h
            free -h
          }
          resources
          trap 'resources || true' EXIT
          state="${WORKER_SWITCH_STATE:?The launcher did not publish its state directory}"
          prefix="$state/launchd"
          fail_wait() {
            [[ ! -f "$prefix.log" ]] || cat "$prefix.log"
            echo "::error::launchd: $*"
            exit 1
          }
          [[ -f "$prefix.pid" ]] || fail_wait "missing process id"
          pid="$(cat "$prefix.pid")"
          [[ "$pid" =~ ^[1-9][0-9]*$ ]] || fail_wait "invalid process id"
          # Actions sends INT before TERM on cancel; forward TERM, which background bash children can trap.
          forward_signal() { kill -TERM -- "-$pid" 2>/dev/null || true; exit "$1"; }
          trap 'forward_signal 130' INT
          trap 'forward_signal 143' TERM
          trap 'forward_signal 129' HUP
          # An absolute deadline starts at launch, so the second wait never gets a fresh execution budget.
          deadline=$(( $(cat "$state/started") + 24 * 60 ))
          sample=$((SECONDS + 60))
          while [[ ! -f "$prefix.exit" ]]; do
            if ! kill -0 "$pid" 2>/dev/null; then
              # The wrapper may have published status between the file check and the liveness check.
              [[ ! -f "$prefix.exit" ]] || break
              fail_wait "process ended without an exit-code file"
            fi
            (( $(date +%s) < deadline )) || fail_wait "timed out without an exit-code file"
            if (( SECONDS >= sample )); then resources; sample=$((SECONDS + 60)); fi
            sleep 2
          done
          rc="$(cat "$prefix.exit")"
          [[ "$rc" == 0 ]] || fail_wait "exit code $rc"
          tail -n 100 "$prefix.log"
      - name: Clean up worker switch shards
        if: always()
        timeout-minutes: 5
        run: |
          state="${WORKER_SWITCH_STATE:-}"
          [[ -n "$state" && -d "$state" ]] || exit 0
          cleanup_groups() {
            # A second cancellation signal must not interrupt the children's cleanup grace period.
            trap '' INT TERM HUP
            pids=()
            for file in "$state/"*.pid; do
              [[ -f "$file" ]] || continue
              pid="$(cat "$file")"
              [[ "$pid" =~ ^[1-9][0-9]*$ ]] || continue
              pids+=("$pid")
              kill -TERM -- "-$pid" 2>/dev/null || true
            done
            deadline=$((SECONDS + 90))
            for pid in ${pids[@]+"${pids[@]}"}; do
              while kill -0 -- "-$pid" 2>/dev/null && (( SECONDS < deadline )); do sleep 1; done
              if kill -0 -- "-$pid" 2>/dev/null; then
                echo "::warning::forcing remaining process group $pid to stop"
                kill -KILL -- "-$pid" 2>/dev/null || true
              fi
            done
          }
          trap 'cleanup_groups; exit 130' INT
          trap 'cleanup_groups; exit 143' TERM
          trap 'cleanup_groups; exit 129' HUP
          cleanup_groups

  # The Playwright suite (e2e) against a production build, a throwaway Postgres and the stand-in runner
  # (scripts/e2e-runner.ts): no AI, no job channel, no network beyond localhost.
  e2e:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    # Measured: running in the Playwright container image was slower (54 s image pull, slower build and tests) than the
    # host runner with cached browsers, so it stays on the host.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # The role may create the e2e database (scripts/e2e-prepare.ts creates `jobradar_e2e`, migrates and seeds it).
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
      E2E_PORT: "3100"
      # The suite starts the server on the build made by the step below; it does not build again.
      E2E_SKIP_BUILD: "1"
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 5
      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        timeout-minutes: 5
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        timeout-minutes: 5
        with:
          node-version: "22"
          check-latest: true
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install dependencies
        timeout-minutes: 8
        run: pnpm install --frozen-lockfile
      # The browser build follows the locked @playwright/test version, so the lockfile is the cache key.
      # Launch-check cached or downloaded Chromium first; only a failed check triggers apt. Avoiding unnecessary apt
      # calls keeps their long-tail latency and occasional timeouts out of healthy e2e runs.
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        timeout-minutes: 5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Install Playwright browser
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        timeout-minutes: 8
        run: pnpm exec playwright install chromium
      - name: Playwright system libraries (installed only when the browser cannot start)
        timeout-minutes: 8
        run: |
          check_chromium() {
            node -e 'const { chromium } = require("@playwright/test"); const timer = setTimeout(() => { console.error("Chromium launch/close check timed out after 20s"); process.exit(1); }, 20_000); (async () => { const browser = await chromium.launch({ headless: true, timeout: 10_000 }); await browser.close(); clearTimeout(timer); console.log("Chromium launch/close check passed"); })().catch(error => { console.error(error); process.exit(1); });'
          }
          if ! check_chromium; then
            echo "::warning::Chromium could not start; installing Playwright system libraries and retrying."
            pnpm exec playwright install-deps chromium
            check_chromium
          fi
      # Next's incremental build cache only; the app is always built from the current source.
      - name: Cache the Next build cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        timeout-minutes: 5
        with:
          path: .next/cache
          key: nextjs-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('src/**', 'messages/**', 'next.config.ts') }}
          restore-keys: nextjs-${{ hashFiles('pnpm-lock.yaml') }}-
      - name: Build
        timeout-minutes: 8
        run: pnpm build
      # Explicitly keep two Playwright workers on the 4-core runner; the specs run fully parallel.
      # A test that only passes on its retry fails the job (the retry still records a trace for the report).
      - name: End-to-end tests
        timeout-minutes: 15
        run: pnpm test:e2e --workers=2 --fail-on-flaky-tests
      # The first-run setup wizard on a fresh install (empty config / profile directories, empty database, no stand-in
      # runner): its own port, database and directories, after the main suite, on the same build.
      - name: Setup wizard end-to-end tests
        timeout-minutes: 6
        run: pnpm test:e2e:setup --fail-on-flaky-tests
      - name: Upload the Playwright report and traces
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        timeout-minutes: 5
        with:
          name: playwright-report
          path: |
            playwright-report/
            playwright-report-setup/
            test-results/
          retention-days: 7

  # Linux first run from scratch: an empty checkout on Ubuntu, `docker compose up --build` with the defaults (only
  # PUID / PGID set to the runner's user, as docs/host-setup.md says), and the dashboard answers. Catches file ownership
  # and permission problems that Docker Desktop on macOS hides, and, because it builds the three production images (web,
  # runner, jobspy), a Dockerfile or COPY that no longer builds. The images are built the way scripts/ops/deploy.sh builds
  # them, from an unpacked `git archive` of the commit (JOB_RADAR_BUILD_CONTEXT), and the shipped config in them is
  # checked: exactly the committed config/ files, owned by root, readable by all, writable by none, nothing mounted over
  # it. The .gitignore coverage test checks that a build from the working tree leaves out every ignored file.
  linux-smoke:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 5
      - name: Prepare .env and the data folders as the host user
        timeout-minutes: 2
        run: |
          printf 'PUID=%s\nPGID=%s\n' "$(id -u)" "$(id -g)" > .env
          mkdir -p data/config data/profile data/backups data/exports data/logs .auth
      - name: Unpack the commit as the build context
        timeout-minutes: 2
        run: |
          ctx="$(mktemp -d)"
          git archive HEAD | tar -x -C "$ctx"
          echo "JOB_RADAR_BUILD_CONTEXT=$ctx" >> "$GITHUB_ENV"
          echo "build context: $ctx ($(find "$ctx" -type f | wc -l) files)"
      - name: Start the stack from scratch
        timeout-minutes: 15
        run: docker compose up -d --build --wait --wait-timeout 600
      - name: Dashboard health check
        timeout-minutes: 2
        run: |
          curl -fsS --retry 5 --retry-delay 3 --retry-all-errors http://127.0.0.1:3000/api/health
          echo
          code=$(curl -s -o /dev/null -w '%{http_code}' -H 'accept: text/html' http://127.0.0.1:3000/)
          echo "GET / -> $code"
          [[ "$code" =~ ^(200|307|308)$ ]] || { echo "::error::the dashboard page answered $code"; exit 1; }
      - name: The web can write its config folder
        timeout-minutes: 2
        run: |
          docker compose exec -T web sh -c 'touch /app/data/config/.write-check && rm /app/data/config/.write-check'
          docker compose exec -T runner sh -c 'test -w /app/data/backups'
          ls -la data/config
      - name: The images ship exactly the committed config
        timeout-minutes: 2
        run: |
          git ls-files config | sort > "$RUNNER_TEMP/config-committed.txt"
          for svc in web runner; do
            docker compose exec -T "$svc" find /app/config -type f | sed 's|^/app/||' | sort > "$RUNNER_TEMP/config-$svc.txt"
            diff -u "$RUNNER_TEMP/config-committed.txt" "$RUNNER_TEMP/config-$svc.txt" \
              || { echo "::error::/app/config in the $svc image differs from git ls-files config"; exit 1; }
          done
          echo "web and runner: $(wc -l < "$RUNNER_TEMP/config-committed.txt") files, as committed"
      - name: The shipped config is read-only for every user
        timeout-minutes: 2
        run: |
          # Four finds, run as the container's own user; each must print nothing: everything owned by root, nothing
          # writable by group or others, every file readable by all, every directory readable and searchable by all.
          for svc in web runner; do
            out="$(docker compose exec -T "$svc" sh -c 'find /app/config ! -user root; find /app/config -perm /022; find /app/config -type f ! -perm -444; find /app/config -type d ! -perm -555')"
            [[ -z "$out" ]] || { echo "$out"; echo "::error::wrong owner or permissions under /app/config in the $svc image"; exit 1; }
          done
          echo "web and runner: /app/config owned by root, a+rX, go-w"
      - name: Nothing is mounted over the shipped config
        timeout-minutes: 2
        run: |
          mounts="$(docker inspect --format '{{range .Mounts}}{{.Destination}}{{"\n"}}{{end}}' $(docker compose ps -q web runner))"
          echo "$mounts"
          if grep -qE '^/app/config(/|$)' <<< "$mounts"; then echo "::error::a container has a mount on /app/config"; exit 1; fi
      - name: Docker build context leaves out what .gitignore ignores
        timeout-minutes: 5
        run: bash tests/ops/gitignore-coverage.sh
      - name: Container logs on failure
        if: failure()
        timeout-minutes: 2
        run: |
          docker compose ps -a
          docker compose logs --no-color --tail 200
      - name: Remove the stack and its volume
        if: always()
        timeout-minutes: 5
        run: docker compose down -v --remove-orphans

  # Upgrade transitions with real Docker and the real deploy / install / uninstall scripts of each version, the worker
  # under the systemd simulator (tests/transition/run.sh): A, every documented hop from 62d7ad9 to HEAD; B, from 62d7ad9
  # straight to HEAD (with a failed and a real replacement of the worker installed from the checkout first); D, a deploy
  # whose runner image fails to build changes nothing; C, a release with a broken loader is rolled back; E, the
  # emergency restore of the previous release; then the uninstall. After each step: /app/config of the containers,
  # the worker's directory, --print-release, a run_ai request and the doctor. Each project runs its own database.
  # Two independent processes share the runner and Docker layer cache, with separate run ids and artifact directories.
  # Runs when the deploy side or toolchain changes, and on main or a manual run.
  upgrade-transition:
    needs: changes
    if: needs.changes.outputs.transition == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 5
        with:
          # the scenarios check out every earlier version
          fetch-depth: 0
      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        timeout-minutes: 5
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        timeout-minutes: 5
        with:
          node-version: "22"
          check-latest: true
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install dependencies
        timeout-minutes: 8
        run: pnpm install --frozen-lockfile
      - name: Start transition scenarios
        timeout-minutes: 2
        run: |
          state="$(mktemp -d "$RUNNER_TEMP/transition-shards.XXXXXX")"
          echo "TRANSITION_STATE=$state" >> "$GITHUB_ENV"
          date +%s > "$state/started"
          # Job control gives each wrapper its own process group, including the command's descendants.
          # Cancellation forwards TERM to the whole group before the final cleanup step.
          stop_launchers() {
            trap '' INT TERM HUP
            for file in "$state/"*.pid; do
              [[ -f "$file" ]] || continue
              pid="$(cat "$file")"
              [[ "$pid" =~ ^[1-9][0-9]*$ ]] && { kill -TERM -- "-$pid" 2>/dev/null || true; }
            done
          }
          trap 'stop_launchers; exit 130' INT
          trap 'stop_launchers; exit 143' TERM
          trap 'stop_launchers; exit 129' HUP
          df -h
          free -h
          docker system df
          for shard in A B; do
            set -m
            bash -c '
              set -uo pipefail
              prefix=$1; shift
              printf "%s\n" "$$" > "$prefix.pid.child.tmp"
              mv "$prefix.pid.child.tmp" "$prefix.pid"
              # The whole group receives TERM. Keep the wrapper alive until its child has finished cleanup.
              trap ":" INT TERM HUP
              finish() { rc=$?; printf "%s\n" "$rc" > "$prefix.exit.tmp"; mv "$prefix.exit.tmp" "$prefix.exit"; }
              trap finish EXIT
              "$@" & child=$!
              # Poll before wait so a signal cannot replace the child status with an interrupted-wait status.
              while kill -0 "$child" 2>/dev/null; do sleep 1 || true; done
              rc=0; wait "$child" || rc=$?
              exit "$rc"
            ' _ "$state/$shard" bash tests/transition/run.sh --scenarios "$shard" "$state/$shard/artifacts" </dev/null > "$state/$shard.log" 2>&1 &
            printf '%s\n' "$!" > "$state/$shard.pid.launch.tmp"
            mv "$state/$shard.pid.launch.tmp" "$state/$shard.pid"
            set +m
          done
      - name: Transition scenario A
        if: ${{ !cancelled() }}
        timeout-minutes: 105
        run: |
          resources() {
            df -h
            free -h
            docker system df
          }
          resources
          trap 'resources || true' EXIT
          state="${TRANSITION_STATE:?The launcher did not publish its state directory}"
          prefix="$state/A"
          fail_wait() {
            [[ ! -f "$prefix.log" ]] || cat "$prefix.log"
            echo "::error::A: $*"
            exit 1
          }
          [[ -f "$prefix.pid" ]] || fail_wait "missing process id"
          pid="$(cat "$prefix.pid")"
          [[ "$pid" =~ ^[1-9][0-9]*$ ]] || fail_wait "invalid process id"
          # Actions sends INT before TERM on cancel; forward TERM, which background bash children can trap.
          forward_signal() { kill -TERM -- "-$pid" 2>/dev/null || true; exit "$1"; }
          trap 'forward_signal 130' INT
          trap 'forward_signal 143' TERM
          trap 'forward_signal 129' HUP
          # An absolute deadline starts at launch, so the second wait never gets a fresh execution budget.
          deadline=$(( $(cat "$state/started") + 104 * 60 ))
          sample=$((SECONDS + 60))
          while [[ ! -f "$prefix.exit" ]]; do
            if ! kill -0 "$pid" 2>/dev/null; then
              # The wrapper may have published status between the file check and the liveness check.
              [[ ! -f "$prefix.exit" ]] || break
              fail_wait "process ended without an exit-code file"
            fi
            (( $(date +%s) < deadline )) || fail_wait "timed out without an exit-code file"
            if (( SECONDS >= sample )); then resources; sample=$((SECONDS + 60)); fi
            sleep 2
          done
          rc="$(cat "$prefix.exit")"
          [[ "$rc" == 0 ]] || fail_wait "exit code $rc"
          tail -n 100 "$prefix.log"
      - name: Transition scenario B
        if: ${{ !cancelled() }}
        timeout-minutes: 105
        run: |
          resources() {
            df -h
            free -h
            docker system df
          }
          resources
          trap 'resources || true' EXIT
          state="${TRANSITION_STATE:?The launcher did not publish its state directory}"
          prefix="$state/B"
          fail_wait() {
            [[ ! -f "$prefix.log" ]] || cat "$prefix.log"
            echo "::error::B: $*"
            exit 1
          }
          [[ -f "$prefix.pid" ]] || fail_wait "missing process id"
          pid="$(cat "$prefix.pid")"
          [[ "$pid" =~ ^[1-9][0-9]*$ ]] || fail_wait "invalid process id"
          # Actions sends INT before TERM on cancel; forward TERM, which background bash children can trap.
          forward_signal() { kill -TERM -- "-$pid" 2>/dev/null || true; exit "$1"; }
          trap 'forward_signal 130' INT
          trap 'forward_signal 143' TERM
          trap 'forward_signal 129' HUP
          # An absolute deadline starts at launch, so the second wait never gets a fresh execution budget.
          deadline=$(( $(cat "$state/started") + 104 * 60 ))
          sample=$((SECONDS + 60))
          while [[ ! -f "$prefix.exit" ]]; do
            if ! kill -0 "$pid" 2>/dev/null; then
              # The wrapper may have published status between the file check and the liveness check.
              [[ ! -f "$prefix.exit" ]] || break
              fail_wait "process ended without an exit-code file"
            fi
            (( $(date +%s) < deadline )) || fail_wait "timed out without an exit-code file"
            if (( SECONDS >= sample )); then resources; sample=$((SECONDS + 60)); fi
            sleep 2
          done
          rc="$(cat "$prefix.exit")"
          [[ "$rc" == 0 ]] || fail_wait "exit code $rc"
          tail -n 100 "$prefix.log"
      - name: Clean up transition scenarios
        if: always()
        timeout-minutes: 5
        run: |
          state="${TRANSITION_STATE:-}"
          [[ -n "$state" && -d "$state" ]] || exit 0
          cleanup_groups() {
            # A second cancellation signal must not interrupt the children's cleanup grace period.
            trap '' INT TERM HUP
            pids=()
            for file in "$state/"*.pid; do
              [[ -f "$file" ]] || continue
              pid="$(cat "$file")"
              [[ "$pid" =~ ^[1-9][0-9]*$ ]] || continue
              pids+=("$pid")
              kill -TERM -- "-$pid" 2>/dev/null || true
            done
            deadline=$((SECONDS + 240))
            for pid in ${pids[@]+"${pids[@]}"}; do
              while kill -0 -- "-$pid" 2>/dev/null && (( SECONDS < deadline )); do sleep 1; done
              if kill -0 -- "-$pid" 2>/dev/null; then
                echo "::warning::forcing remaining process group $pid to stop"
                kill -KILL -- "-$pid" 2>/dev/null || true
              fi
            done
          }
          trap 'cleanup_groups; exit 130' INT
          trap 'cleanup_groups; exit 143' TERM
          trap 'cleanup_groups; exit 129' HUP
          cleanup_groups
      - name: Upload the transition logs (scenario A)
        if: ${{ always() && env.TRANSITION_STATE != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        timeout-minutes: 5
        with:
          name: upgrade-transition-logs-A
          path: |
            ${{ env.TRANSITION_STATE }}/A.log
            ${{ env.TRANSITION_STATE }}/A/artifacts/
          retention-days: 7
      - name: Upload the transition logs (scenario B)
        if: ${{ always() && env.TRANSITION_STATE != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        timeout-minutes: 5
        with:
          name: upgrade-transition-logs-B
          path: |
            ${{ env.TRANSITION_STATE }}/B.log
            ${{ env.TRANSITION_STATE }}/B/artifacts/
          retention-days: 7

  # The single check to require: every job the classifier selected must have succeeded; only the jobs it deselected
  # may be skipped. changes, ci-docs, static and unit run for every change.
  ci-ok:
    needs: [changes, ci-docs, static, unit, integration, worker-switch, e2e, linux-smoke, upgrade-transition]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: All selected checks passed
        timeout-minutes: 2
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          code=$(jq -r '.changes.outputs.code // "unknown"' <<< "$NEEDS")
          transition=$(jq -r '.changes.outputs.transition // "unknown"' <<< "$NEEDS")
          jq -r 'to_entries[] | "\(.key): \(.value.result)"' <<< "$NEEDS"
          fail=0
          for job in changes ci-docs static unit; do
            [[ $(jq -r ".\"$job\".result" <<< "$NEEDS") == success ]] || fail=1
          done
          for job in integration worker-switch e2e linux-smoke; do
            r=$(jq -r ".\"$job\".result" <<< "$NEEDS")
            if [[ "$code" == true ]]; then [[ "$r" == success ]] || fail=1; else [[ "$r" == skipped ]] || fail=1; fi
          done
          r=$(jq -r '."upgrade-transition".result' <<< "$NEEDS")
          if [[ "$transition" == true ]]; then [[ "$r" == success ]] || fail=1; else [[ "$r" == skipped ]] || fail=1; fi
          [[ $fail == 0 ]] || { echo "::error::a selected check did not succeed (product: $code)"; exit 1; }
          echo "all selected checks passed (product: $code)"
