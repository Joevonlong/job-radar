version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # Font files change how every page looks: their updates come as one PR of their own, to be checked by eye
      # (the first group that matches a dependency takes it).
      fonts:
        patterns: ["@fontsource/*", "@fontsource-variable/*"]
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
  # pip-compile layout: Dependabot changes a pin in requirements*.in and regenerates the hashed requirements*.txt from it
  - package-ecosystem: pip
    directory: /jobspy
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
  # The digest-pinned base image of jobspy/Dockerfile. The root Dockerfile's FROM lines take their tags from ARGs (the
  # Node major checked against engines, the Playwright version that must match @playwright/test), which this cannot update.
  - package-ecosystem: docker
    directory: /jobspy
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
