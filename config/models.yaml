# AI model catalog: which models each provider offers and what they cost.
# This file only lists what exists; which one to use is chosen in ai.yaml (providers.<name>.model / strong_model, tasks.<task>.models) or in the AI tab of /settings.
# Never put API keys or any other secrets here (secrets go only in .env).
#
# Adding a new model released by a vendor (no restart needed; takes effect about 5 seconds after saving):
#   1. Add an entry under the provider's models: id = the model name from the vendor docs (what gets passed to the CLI / API), label = a recognizable display name.
#   2. API providers (anthropic / deepseek / mimo) must have price: input and output price in USD / 1M tokens, as on the official site.
#      Subscription CLIs (claude-cli / codex-cli) have no price (subscription cost counts as 0).
#   3. Run pnpm config:check in the project directory and make sure there are no errors.
#   4. Try it once: pnpm ai:probe --provider <provider> --model <id>
#   5. Refresh /settings, select it in the "Model" dropdown of that provider's section in the AI tab, and save.
#
# Retiring an old model: first switch to another model in /settings, then add deprecated: true (dropped from the dropdown; a model still in use is marked "deprecated").
# Delete the entry once nothing uses it; deleting a model still selected in ai.yaml makes config:check report "not in the model catalog".
#
# Keys per model:
#   id                 required; unique within a provider
#   label              display name; unset = show the id
#   aliases            other names the vendor reports in responses (e.g. dated snapshot names); also recognized for cost accounting
#   price              { input_per_mtok, output_per_mtok }; API providers only, and required for them;
#                      may add cached_input_per_mtok (cache-hit input), cache_write_per_mtok (cache-write input); unset = billed at input_per_mtok
#   equivalent_price   subscription CLIs only (claude-cli / codex-cli): what the same model would cost at official API prices (only for "API-equivalent cost" on /sources/ai-usage,
#                      not counted in the monthly budget). Same keys as price, plus a required source (price source and date). Changes only affect new calls
#   reasoning_efforts  codex-cli only: reasoning efforts this model supports (minimal / low / medium / high / xhigh / max; ultra opens up after deployment); unset = all
#   cli_default        codex-cli only, at most one: the model the CLI actually uses when ai.yaml sets no codex model
#   deprecated         true = retired
#   notes              remarks, shown as-is on the settings page
# The provider level may have: label (required), docs_url (official models / pricing page, shown as a link on the settings page), notes. Providers can't be added or removed (each provider's call method lives in code).

providers:
  claude-cli:
    label: Claude Code CLI
    models:
      - id: claude-fable-5-1
        label: Claude Fable 5.1
        equivalent_price: { input_per_mtok: 10, output_per_mtok: 50, cached_input_per_mtok: 0.25, cache_write_per_mtok: 12.5, source: "Anthropic API pricing (5 min cache write), platform.claude.com/docs/en/about-claude/pricing, checked 2026-10-09" }
      - id: claude-haiku-5-5
        label: Claude Haiku 5.5
        notes: "Prices are for the up-to-100K tier; prompts over 100K cost input 0.5 / output 2.5 / cache read 0.05 / cache write 0.625 (USD / 1M tokens)"
        equivalent_price: { input_per_mtok: 0.1, output_per_mtok: 0.5, cached_input_per_mtok: 0.01, cache_write_per_mtok: 0.125, source: "Anthropic API pricing (5 min cache write), platform.claude.com/docs/en/about-claude/pricing, checked 2026-10-09" }
      - id: claude-haiku-4-5
        label: Claude Haiku 4.5
        notes: "Retires 2026-10-15 at the earliest"
        equivalent_price: { input_per_mtok: 1, output_per_mtok: 5, cached_input_per_mtok: 0.1, cache_write_per_mtok: 1.25, source: "Anthropic API pricing (5 min cache write), platform.claude.com, checked 2026-10-09" }
      - id: claude-sonnet-5-5
        label: Claude Sonnet 5.5
        equivalent_price: { input_per_mtok: 2, output_per_mtok: 10, cached_input_per_mtok: 0.1, cache_write_per_mtok: 2.5, source: "Anthropic API pricing (5 min cache write), platform.claude.com, checked 2026-10-09" }
      - id: claude-opus-5-5
        label: Claude Opus 5.5
        equivalent_price: { input_per_mtok: 4, output_per_mtok: 20, cached_input_per_mtok: 0.2, cache_write_per_mtok: 5, source: "Anthropic API pricing (5 min cache write), platform.claude.com, checked 2026-10-09" }
  codex-cli:
    label: Codex CLI
    models:
      - id: gpt-6.1-sol
        label: GPT-6.1 Sol
        # codex-cli 0.162.0 uses this model when -m is not passed (checked when this default was set)
        cli_default: true
        equivalent_price: { input_per_mtok: 2, output_per_mtok: 10, cached_input_per_mtok: 0.1, cache_write_per_mtok: 2.5, source: "OpenAI API pricing, standard tier (prompts up to 272K), openai.com / developers.openai.com, checked 2026-10-09" }
