# What I want (template). Copied to data/profile/preferences.yaml on first run; after that, edit only the copy in data/profile/.

config_version: 3
market:
  # Market: pack = market pack (directory name under config/packs/); country / currency / home_language default to the pack's values when unset.
  # The generic pack sets no country, currency or language, so fill them all in; countries with their own market pack (e.g. de) only need pack
  pack: generic
  country: US
  currency: USD
  home_language: en

target_titles:
  - Software Engineer

# Where a job counts as local. It is sent to your AI provider with every job.
home_city: New York

# Other places a job can be based. relocate: true = I'd move here; false = remote only.
# A city, a country, a region or Worldwide, e.g. {place: Amsterdam, relocate: true} or {place: eu, relocate: false}.
places: []

# onsite | hybrid | remote
workplace: [onsite, hybrid, remote]
# all | entry | mid | senior | lead
seniority: all

# Annual salary floor (market base currency, gross): jobs whose stated maximum is below it are filtered out; jobs without a stated salary are kept
salary_floor_year: 70000

# Contract types: permanent | fixed_term | freelance | temp_agency
contracts:
  allow: [permanent, fixed_term, freelance]
  exclude: [temp_agency]

# Exclude internships, apprenticeships, working-student, thesis and other student jobs
exclude_student_roles: true
# These two lists are sent to your AI provider with every job (see docs/privacy.md), so do not put anything in them you would not tell that provider
exclude_companies: []
exclude_keywords: []

# Deal-breakers: rules that veto a job before any AI call (optional; see docs/deal-breakers.md). A vetoed job is kept and
# shown under "Show filtered" with the rule's name; "Keep anyway" on its page brings it back.
# deal_breakers:
#   # the posting requires the market's local language above your level in me.yaml
#   - id: language-gate
#     label: Local language above my level
#     type: language_gate
#   # whole words (case and accents ignored) and / or regular expressions; unless: a sentence that matches does not count
#   - id: travel
#     label: Lots of travel
#     type: phrase
#     terms: [travel]
#     unless: ['\bno travel\b']
#     scope: description
