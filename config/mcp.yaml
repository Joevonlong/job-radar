# MCP server (docs/mcp.md): lets an MCP client you configure yourself (Claude Desktop, Claude Code, ...) query your jobs and
# applications. The client starts `pnpm mcp:serve` as a local child process and talks to it over stdio; no port is opened. Nothing
# can be written, except that `save_application_answer`, when you grant writer:write, adds answer versions; it cannot change or
# delete any. Each call also adds one metadata row to the local `agent_calls` table (see `audit` below).
# Privacy: whatever the tools return is handed by your client to the model provider it uses (Anthropic for Claude, ...).
# What may be returned is fixed in code: job facts, source links, scores and ranks, signals with their JD quotes, the JD after
# AI-trap cleaning, and the status, dates, next step and interview rounds of your applications. Match and note fields require
# their own permissions. Never returned: contact/career files, profile snapshots, import drafts, emails, local paths, keys.
# profile:read shares me/preferences/stories (including salary floor and language levels), interests and read-only previews.
# Only when writer:read is granted (it gives `get_application_context`): your application questions and answer versions, and the material
# you chose for each question, which can include your profile summary, skills and languages, chosen stories and emphasis note.

# Version of this file's structure; don't edit by hand (a migration script upgrades it when the structure changes)
config_version: 3

# Master switch. false: `pnpm mcp:serve` refuses to start and says why (your client shows the message)
enabled: false

# The global matrix is the most any connection may receive. Tool permissions:
# search_jobs / get_job: jobs:read; list_applications: tracking:read
# get_profile / get_interests / preview_deal_breakers / preview_interest_category: profile:read (off by default)
# get_application_context: writer:read and writer.yaml enabled (shares your chosen application material)
# save_application_answer: writer:write and writer.yaml enabled (only adds answer versions)
# match:read / notes:read add fields to job tools; other catalog ids are accepted but do not give tools yet.
permissions:
  - jobs:read
  - tracking:read

# The local stdio connection receives only the intersection of this list and the global matrix above.
stdio:
  permissions:
    - jobs:read
    - tracking:read

limits:
  # Most jobs, applications or pending interest suggestions one call returns (1-100); the answer says when more matched
  max_results: 20
  # Most characters of a JD one get_job call returns (500-100000); a longer JD is cut and marked as cut
  max_description_chars: 12000

# The call record (docs/mcp.md, "Audit trail"): time, tool, target id, outcome, count and duration of each call; never its
# arguments, what it returned, or an error message.
audit:
  # Days a call row is kept (1-3650); the runner deletes older rows, also while the server is off
  retention_days: 90
  # Dedicated audit connection: at most one session, with bounded waits
  connect_timeout_seconds: 2
  statement_timeout_ms: 1500
  lock_timeout_ms: 200
  # Longest a call waits for its audit row (100-10000), queueing included; also the longest shutdown waits for the last rows
  write_timeout_ms: 2000
