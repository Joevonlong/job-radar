# Application writer (docs/application-writer.md): your experience library on /me (data/profile/stories.yaml), the material
# application answers and cover letters are written from.
# Privacy: the experience library stays on this machine; nothing of it is sent to an AI provider while `enabled` is false.

# Version of this file's structure; don't edit by hand (a migration script upgrades it when the structure changes)
config_version: 1

# Master switch of the AI writing features. false (the default): nothing of the writer is sent to an AI provider, and the
# "Write answers" page only says how to switch it on. When true, the material you select for a question (JD points,
# your profile summary and skills, stories, what to emphasise) is sent to the providers of ai.yaml's `write` task.
enabled: false

# Longest run of one writing request in seconds, from when the ai-worker takes it; the worker then stops the AI call and
# the request fails as "timeout"
timeout_seconds: 180
# A running request still open timeout_seconds + this many seconds (its worker died or hangs) fails as "expired" and its
# material is cleared from the request
expiry_grace_seconds: 60
# Longest wait of a queued request in seconds (one interactive request runs at a time, so several pressed in a row wait
# for each other); an older one fails as "expired" and its material is cleared
queue_timeout_seconds: 900

# Limits of the experience library, checked when you save it on /me
stories:
  # Most stories in the library
  max_items: 60
  # Longest title; also the longest single entry of a story's metrics, skills and tags
  title_max_chars: 120
  # Longest "what you did" and "result" text of one story
  text_max_chars: 1500
  # How many stories a new application question starts with selected (best skill overlap with the job first)
  preselect_count: 4

questions:
  # Most questions per job
  max_per_job: 12
  # Longest question text
  text_max_chars: 1000
  # Most versions of one question besides the final one; the oldest goes beyond it
  max_versions_per_question: 20
  # Default length (unit: words or chars) and how many versions one draft asks for
  kinds:
    question: { default_length: { unit: words, value: 150 }, variants: 3 }
    letter: { default_length: { unit: words, value: 350 }, variants: 2 }

# The styles of the versions of one draft, in order: a draft with 2 versions asks for the first two
variants:
  - { id: safe, hint: "clear and conservative" }
  - { id: distinctive, hint: "more personal voice" }
  - { id: short, hint: "tighter, about 70% of the target length" }

# Tones a question can ask for (the first is the default)
tones: [neutral, warm, confident, formal]

# Longest "what to emphasise this time" note
emphasis_max_chars: 800
# Longest JD excerpt sent when no breakdown points are selected
jd_max_chars: 6000
# Share of jd_max_chars taken from the beginning of a longer JD (the rest from its end)
jd_head_share: 0.7
# An answer that did not parse and reached this share of the output token cap counts as cut off ("output_truncated")
output_truncated_share: 0.95

# Starting from an answer you finalised for another job: when you add a question, finalised answers to similar questions
# are offered as the starting text. Local only (no AI call, nothing is sent); similarity counts shared words, so the same
# question in another language is not matched.
reuse:
  # Lowest share of words a new question must have in common with an earlier one (0.05-1)
  min_similarity: 0.55
  # Most earlier answers offered for one new question
  max_candidates: 3

# The evidence check of every sentence (in code, no AI call). It flags names and figures to check; it does not prove the
# AI made nothing up.
evidence:
  # Longest quote the AI may give as the evidence of a sentence
  quote_max_chars: 160
  # Shortest quote that counts as evidence, in characters; a shorter one counts only when it is a known name (a skill such as "Go")
  min_quote_chars: 4
  # Words that make a sentence one about you, whatever the AI labelled it (whole words; zh: substrings minus `exclude`)
  first_person:
    en: [i, "i'm", "i've", "i'd", my, me, myself]
    de: [ich, mein, meine, meinen, meinem, meiner, mich, mir]
    zh: { words: [我, 我的], exclude: [我们, 我们的] }
  # Words treated as names: one not found in the sentence's valid quotes (for a sentence about the job or company, also the
  # JD and the company background) is marked "check"
  names:
    # Names in quotation marks
    quoted: true
    # Words with digits, inner capitals or all capitals (S3, GitLab, AWS)
    mixed_tokens: true
    # Capitalised words not at the start of a sentence: single = each one, multi = only two or more in a row
    # (languages that capitalise every noun), off = none
    capitalized_non_initial: { default: single, de: multi }
    # Capitalised words that are never names
    stopwords: [I, OK]
