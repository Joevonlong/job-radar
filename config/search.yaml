# Search criteria. Each keyword group is OR-joined into one query, which then runs once per place in preferences.yaml (`home_city`, `places`).
config_version: 3
# Replace them with the job titles you are looking for (the setup wizard does this from your target roles).
keyword_groups:
  targets:
    - Software Engineer


# Lookback window per run (hours). Keys map to schedule.yaml: weekday_morning → morning, weekday_evening → evening, weekend → weekend
window_hours:
  morning: 24
  evening: 10
  weekend: 24

# Max results per keyword group per city
max_per_group_per_location: 40

# Nationwide searches send watched company names to enabled providers; see docs/privacy.md.
watched_company_queries:
  enabled: true
  max_per_cycle: 3
  min_interval_hours: 24
  max_results: 25
