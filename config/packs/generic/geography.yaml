# Generic geography: world country table, named regions, European city table, state codes.
# If pattern is set it is used (regex, case-insensitive); otherwise name + aliases match as whole words; countries with match: false are never detected from text (their names cause false matches).
# currency: the country's currency (ISO 4217): the setup wizard proposes it as the base currency when you pick the country.
# cities: spelling in a location -> [canonical name, country]. The canonical name is part of the dedup key; don't change it.

countries:
  - {code: GB, currency: GBP, name: United Kingdom, aliases: [UK, Great Britain, England, Scotland, Wales, Northern Ireland], indeed: uk, pattern: northern ireland|\b(?:united kingdom|great britain|england|scotland|wales)\b|\buk\b}
