# German rules: German company suffixes, agencies, contract phrases, out-of-scope remote markers and body phrases for "hired in Germany / the EU".

company:
  legal_suffixes: [gmbh, mbh, ag, se, kg, kgaa, ug, ohg, gbr, ev]
  agency_names: [Gulp, Haystack, Rocken, Instaffo]
agency:
  company_name_patterns:
    - personalberatung
    - personalvermittlung
    - personaldienstleist
    - personalmanagement
    - \bzeitarbeit
  text_patterns:
    - für unseren kunden
    - für (?:unseren|meinen|einen unserer) mandanten
    - im auftrag (?:unseres|eines|meines|unserer) (?:kunden|kundin|mandanten|klienten|auftraggebers)
    - im auftrag eines? unserer (?:kunden|mandanten)
    - für einen? (?:unserer |meiner )?(?:kunden|mandanten|klienten|auftraggeber)\b
    - unser(?:e)? (?:kunde|kundin|mandant|auftraggeber) (?:ist|sucht|bietet)\b
    - \bim kundenauftrag\b
    - \bim auftrag (?:eines|einer|von) (?:kunden|kundin|unseres|unserer)
    - \b(?:für|fuer) (?:einen|eine) (?:unserer )?(?:renommierten |namhaften )?(?:kunden|kundin)\b
    - \bpersonalberatung\b
    - \bpersonalvermittlung\b
    - \bpersonaldienstleister\b
  exclude_context_patterns:
    - \bunaufgefordert\w*
    - \bkeine\b[^.\n]{0,60}\b(?:personalberat|personalvermittl|personaldienstleist|headhunter|agentur)
    - \bnicht (?:akzeptier|annehmen|berücksichtig)
    - \bohne (?:personalberat|personalvermittl|personaldienstleist|agentur)
contract:
  student:
    - \bwerkstudent
    - praktik(?:um|ant)
    - \bpflichtpraktik
    - \bausbildung\b
    - \bauszubildende
    - \bazubi\b
    - \bduales? studium\b
    - abschlussarbeit
    - \b(?:master|bachelor)arbeit
  temp_agency:
    - \bzeitarbeit
    - arbeitnehmerüberlassung
    - arbeitnehmerueberlassung
  direct_hire:
    - \b(?:vertragsart|anstellungsart|beschäftigungsart|art der anstellung|anstellungsverhältnis|employment type|contract type)\s*:\s*(?:personalvermittlung|direktvermittlung|direct hire|direct placement)\b
    - \bdirektvermittlung\b
    - \bim rahmen (?:der|einer) (?:direkten )?personalvermittlung\b
    - \b(?:direkte|feste) (?:festanstellung|anstellung|einstellung) (?:bei|beim) (?:unserem|unserer|unseren|dem|der) (?:kunden|kundin|mandanten|auftraggeber)
  freelance:
    - \bfreiberuf
    - \bfreie[rn]? mitarbeit
  fixed_term:
    - \bbefristet
    - \bzeitvertrag\b
    - \bbefristete[nrs]? (?:vertrag|stelle|anstellung|arbeitsvertrag)
    - \bmutterschaftsvertretung\b
    - elternzeitvertretung
  permanent:
    - \bunbefristet
    - \bfestanstellung\b
    - \bunbefristete[nrs]? (?:vertrag|stelle|anstellung|arbeitsvertrag)
    - \bdauerstelle\b
    - \bfeste anstellung\b
    - \b(?:employment|job|contract|position)[\s-]*(?:type)?\s*:\s*(?:permanent|festanstellung)\b
    - \b(?:employment|job|contract|position)[\s-]*(?:type)?\s*:[^\n:]{0,40}\b(?:permanent|festanstellung|unbefristet)\b
    - \b(?:art der anstellung|anstellungsart|beschäftigungsart|vertragsart|anstellungsverhältnis)\s*:\s*(?:unbefristet|festanstellung|permanent)
filter:
  generic_location_patterns:
    - ^\W*(?:mehrere standorte|flexibel)\W*$
  remote:
    worldwide_patterns:
      - \bweltweit\b
    outside_patterns:
      - \busa\b
      - \bu\.s\.
      - \bunited states\b
      - \bthe us\b
      - \bnorth america\b
      - \bamericas?\b
      - \blatam\b
      - \bcanada\b
      - \bapac\b
      - \basia\b
      - \bindia\b
      - \bsingapore\b
      - \baustralia\b
      - \bnew zealand\b
      - \bmiddle east\b
      - \bafrica\b
      - \b(?:colombia|mexico|brazil|brasil|argentina|chile|peru|uruguay|costa rica|panama|ecuador|venezuela|bolivia|paraguay|guatemala)\b
      - \b(?:japan|tokyo|korea|seoul|china|beijing|shanghai|hong kong|taiwan|vietnam|thailand|bangkok|malaysia|kuala lumpur|indonesia|philippines|manila|pakistan|bangladesh|sri lanka)\b
      - \b(?:israel|tel aviv|saudi|riyadh|dubai|uae|emirates|qatar|egypt|nigeria|kenya|south africa|morocco|ghana)\b
      - \b(?:toronto|vancouver|montreal|ottawa|ontario|british columbia|quebec|alberta)\b
      - \b(?:new york|san francisco|los angeles|seattle|austin|boston|denver|chicago|atlanta|dallas|houston|miami|washington|mountain view|palo alto|san jose|san diego|portland|philadelphia|phoenix|salt lake|raleigh|pittsburgh|minneapolis|detroit|nashville|charlotte|brooklyn|cambridge, ma|boulder|sunnyvale|menlo park|redwood city|bellevue|arlington|reston|mclean|edison)\b
      - \b(?:alabama|alaska|arizona|arkansas|california|colorado|connecticut|delaware|florida|hawaii|idaho|illinois|indiana|iowa|kansas|kentucky|louisiana|maine|maryland|massachusetts|michigan|minnesota|mississippi|missouri|montana|nebraska|nevada|new hampshire|new jersey|new mexico|north carolina|north dakota|ohio|oklahoma|oregon|pennsylvania|rhode island|south carolina|south dakota|tennessee|texas|utah|vermont|virginia|wisconsin|wyoming)\b
      - \b(?:east coast|west coast|midwest|northeast|southeast|southwest|northwest|central) - (?:united states|us|usa)\b
    title_outside_patterns:
      - (?:^|[-–—|,(/:])\s*(?:us|usa|u\.s\.(?:a\.)?|united states|north america|americas|latam|latin america|canada|apac|asia|india|brazil|mexico|australia)(?:\s+(?:east|west|central)(?:\s+coast)?)?(?:\s+(?:remote|only|based))?\s*(?:$|[-–—|,)/])
      - \b(?:us|u\.s\.) (?:east|west|central) coast\b
      - \b(?:east|west) coast\b
      - \b(?:us|usa|u\.s\.|canada)[- ](?:based|only|remote)\b
    description_in_scope_patterns:
      - \b(?:remote(?:ly)?|work(?:ing)? remotely|work from (?:home|anywhere)|home ?office)\W{0,3}(?:from|within|in|across|throughout)\s+(?:anywhere\s+in\s+)?(?:the\s+)?(?:germany|deutschland|eu|european union|europe|eea)\b
      - \b(?:germany|deutschland|eu|european union|europe|eea)[- ](?:wide|remote)\b
      - \b(?:hir(?:e|ing)|employ(?:ing|ment)?|candidates?|residents?)\b[^.\n]{0,30}\b(?:in|within|across|throughout)\s+(?:the\s+)?(?:germany|deutschland|eu|european union|europe|eea)\b
      - \b(?:hir(?:e|ing)|candidates?|apply from|work from|employees? in)\b[^.\n]{0,80}\b(?:germany|deutschland)\b
      - \b(?:deutschlandweit|bundesweit)\b[^.\n]{0,30}\b(?:remote|home ?office|mobil)
      - \bremote\b[^.\n]{0,15}\b(?:aus|in|innerhalb)\s+(?:deutschland|der eu|europa)\b

# Stellenseite, die keine Bewerbungen mehr annimmt (German phrases for the recheck of starred / followed jobs; regex, case-insensitive)
closed_posting:
  phrases:
    - \bnicht mehr verfügbar\b
    - \bStelle (?:ist )?(?:bereits )?(?:besetzt|vergeben)\b
    - \bBewerbungs(?:phase|frist) (?:ist )?(?:beendet|abgelaufen)\b
    - \bnimmt keine Bewerbungen mehr\b

# Anzeichen, dass eine Anzeige keine echte offene Stelle ist (German patterns of the ghost job check; docs/ghost-jobs.md).
# Regex, case-insensitive with Unicode: word boundaries are (?<![\p{L}\p{N}]) / (?![\p{L}\p{N}]); \b does not know umlauts.
# Keys, `id` and `check_negation` as in the generic pack.
ghost:
  # Deutsch stellt "nicht" oft ans Satzende ("Für unseren Talentpool ist diese Anzeige ganz ausdrücklich nicht gedacht"): nach einer
  # Phrase wird bis zum Ende des Teilsatzes nach einer Verneinung gesucht, nicht nur pipeline.yaml negation_words_after Wörter.
  negation_after: clause
  # LinkedIn auf Deutsch: "Wiedereingestellt vor 2 Wochen"
  repost_label_patterns:
    - id: reposted
      pattern: '(?<![\p{L}\p{N}])(?:wiedereingestellt|wieder\s+eingestellt|erneut\s+(?:veröffentlicht|gepostet|eingestellt|ausgeschrieben))(?![\p{L}\p{N}])'
  evergreen_patterns:
    # "Diese Ausschreibung dient dem Aufbau unseres Talentpools", "Wir suchen für unseren Talent-Pool"
    - id: talent_pool
      pattern: '(?<![\p{L}\p{N}])(?:für|aufbau|erweiterung|ausbau)\s+(?:unser(?:es|en|em|e)?|des|den|einen?|eines)\s+(?:\p{L}+\s+)?(?:talent-?\s?pools?|talent-?\s?community|bewerber-?pools?|kandidaten-?pools?|talentnetzwerk(?:e?s)?)(?![\p{L}\p{N}]|-\p{L})'
    # "Diese Stelle dient der Sammlung von Initiativbewerbungen", "Die Ausschreibung richtet sich an zukünftige Vakanzen", "Dies ist
    # eine Initiativbewerbung"
    # (a talent pool is talent_pool's; "zukünftige" only with an opening: not "zukünftige Kollegen", "zukünftige Führungsaufgaben")
    - id: open_application
      pattern: '(?<![\p{L}\p{N}])(?:(?:stelle|ausschreibung|stellenausschreibung|stellenanzeige|anzeige|position|vakanz)\s+(?:ist|dient|richtet\s+sich|gilt)|(?:dies|hier)\s+ist|es\s+handelt\s+sich\s+um)\s+(?:[\p{L}-]+\s+){0,5}?(?:initiativbewerbung\p{L}*|initiativ|(?:zukünftige|künftige)n?\s+(?:stellen|vakanzen|positionen|ausschreibungen))(?![\p{L}\p{N}])'
    # "Initiativbewerbung (m/w/d)" as the posting's own title in the text, anywhere
    - id: open_application_title
      pattern: '(?<![\p{L}\p{N}])initiativbewerbung(?:en)?\s*\(\s*(?:m|w|d|f|x|gn|div|all)\s*/'
    # … or a line that opens with it: "Initiativbewerbung", "Initiativbewerbung – Softwareentwickler", "Initiativbewerbung für
    # Entwickler", "Initiativbewerbung als …"; only above the first duties heading (responsibility_patterns): below the duties of a
    # real posting the same line is its footer ("Initiativbewerbungen:" / "Wir freuen uns auch über …")
    - id: open_application_title
      pattern: '^[\s#*_•·-]*initiativbewerbung(?:en)?[*_]*(?:\s*[–—:|(]|\s+-\s|\s+(?:für|als)(?![\p{L}\p{N}])|(?=[ \t]*(?:\n|$)))'
      only_before_duties: true
    # "Es gibt keine konkrete Stelle", "nicht für eine bestimmte Position"
    - id: no_specific_opening
      pattern: '(?<![\p{L}\p{N}])(?:kein(?:e|en)?|nicht\s+(?:für|auf|an)\s+(?:eine|einen))\s+(?:konkrete|bestimmte|offene|aktuelle|ausgeschriebene|vakante|spezifische|feste)n?\s+(?:stelle|position|vakanz|stellenausschreibung|ausschreibung)(?:n)?(?![\p{L}\p{N}])'
      check_negation: false
    # "Wir stellen laufend ein", "Wir suchen ständig neue Kolleg:innen", "Wir suchen laufend für unsere Kunden" (a staffing agency),
    # "Wir sind immer auf der Suche nach motivierten Menschen". Always with a person (or "ein"): not "Wir stellen ständig neue
    # Anforderungen", "Wir suchen ständig nach neuen Wegen"; customers only after "für" (not sales: "sucht ständig nach neuen Kunden").
    - id: always_hiring
      pattern: '(?<![\p{L}\p{N}])(?:(?:stellen|stellt)\s+(?:wir\s+|sie\s+)?(?:laufend|ständig|fortlaufend|kontinuierlich|jederzeit|permanent|das\s+ganze\s+jahr(?:\s+über)?)\s+(?:[\p{L}:*_/-]+\s+){0,3}?ein|(?:suchen|sucht)\s+(?:wir\s+|sie\s+)?(?:laufend|ständig|fortlaufend|kontinuierlich|jederzeit|permanent|das\s+ganze\s+jahr(?:\s+über)?)\s+(?:(?:(?:nach|für)\s+)?(?:\p{L}+\s+){0,2}?(?:menschen|talente\p{L}*|verstärkung|kolleg\p{L}*|mitarbeit\p{L}*|persönlichkeiten|bewerber\p{L}*|fachkr[aä]ft\p{L}*|personal|nachwuchs|entwickler\p{L}*|ingenieur\p{L}*|engineers?)|für\s+(?:\p{L}+\s+){0,2}?(?:kunden|kundinnen|mandanten|auftraggeber\p{L}*))|(?:immer|stets|ständig|laufend|jederzeit)\s+auf\s+der\s+suche\s+nach\s+(?:\p{L}+\s+){0,2}?(?:menschen|talenten|verstärkung|kolleg\p{L}*|mitarbeit\p{L}*|persönlichkeiten|bewerber\p{L}*))(?![\p{L}\p{N}])'
    # "Bewirb dich jetzt für unseren KI-Talentpool", "Sende uns deinen Lebenslauf für unseren Tech-Talentpool": after "für", a
    # compound or up to two words before it, and only in a sentence with recruiting words (requires_context): not "Organisiere
    # Events für unseren KI-Talentpool", "Bewerbungen nehmen wir gerne in unseren Talentpool auf" (the footer of a real posting),
    # "Sie sind Ansprechpartner für alle Bewerber in unserem Talentpool" (a recruiter's work)
    - id: talent_pool_join
      pattern: '(?<![\p{L}\p{N}])für\s+unser(?:en|em|es|e)?\s+(?:[\p{L}-]+\s+){0,2}?(?:\p{L}+-\s?)?talent-?\s?(?:pools?|community|netzwerk(?:e?s)?)(?![\p{L}\p{N}]|-\p{L})'
      requires_context:
        - '(?<![\p{L}\p{N}])(?:bewirb\p{L}*|bewerb\p{L}*|lebenslauf|lebensläufe|cv|unterlagen|kandidat\p{L}*|kontaktier\p{L}*|suchen\s+wir|wir\s+suchen|(?:zukünftige|künftige|kommende|neue|offene|passende)n?\s+(?:stellen|positionen|vakanzen|jobs|jobangebote))(?![\p{L}\p{N}])'
    # "Wir sammeln Bewerbungen für zukünftige Stellen"
    - id: future_openings
      pattern: '(?<![\p{L}\p{N}])(?:für|auf)\s+(?:zukünftige|künftige|kommende|spätere)\s+(?:stellen|positionen|vakanzen|ausschreibungen|bedarfe|einsätze)(?![\p{L}\p{N}])'
  responsibility_patterns:
    - id: responsibilities
      pattern: '(?<![\p{L}\p{N}])(?:(?:deine|ihre|eure|unsere|die|meine|deine\s+wichtigsten|ihre\s+wichtigsten)\s+)?(?:aufgaben\p{L}*|tätigkeit\p{L}*|verantwortung(?:en|sbereich)?|zuständigkeit\p{L}*|stellenbeschreibung|jobbeschreibung)(?![\p{L}\p{N}])'
    - id: what_you_do
      pattern: '(?<![\p{L}\p{N}])(?:was\s+(?:du|sie)\s+(?:bei\s+uns\s+)?(?:bewegst|bewegen|tun|tust|machst|machen|erreichst|erreichen)|das\s+erwartet\s+(?:dich|sie)|was\s+(?:dich|sie)\s+erwartet)(?![\p{L}\p{N}])'
    - id: the_role
      pattern: '^(?:deine|ihre|die|dein|ihr)\s+(?:rolle|mission|herausforderung(?:en)?|job|einsatz)$'
    # "Darum geht's", "Wie Sie etwas bewirken können", "Wie du bei uns etwas bewirken kannst", "In deiner Mission blühst du auf, denn:"
    - id: darum_gehts
      pattern: '^darum\s+geht(?:[''’]?s|\s+es)$'
    - id: wie_du_bewirkst
      pattern: '^wie\s+(?:du|sie)\s+(?:bei\s+uns\s+)?(?:etwas\s+)?bewirken\s+(?:kannst|können|wirst|werden)$'
    - id: in_deiner_rolle
      pattern: '^in\s+(?:deiner|ihrer)\s+(?:rolle|mission)(?![\p{L}\p{N}])'
  # Fragewörter: eine Überschrift mit "?" am Ende ("Welche Aufgaben erwarten dich?") gilt nur nach einem davon als Überschrift.
  question_words: [was, wie, 'welche\p{L}*', wer, warum, wieso, weshalb, wo, wann, womit, wofür]
  negation_cues:
    - nicht
    - nein
    - nie
    - niemals
    - 'kein\p{L}*'
    - ohne
  # Where the clause ends for the negation search. A comma ends it only before a relative pronoun or conjunction ("…, die keine Angst
  # vor neuen Technologien haben"); an inserted ", wie du dir denken kannst," does not. "nicht nur" is a break, not a negation.
  clause_breaks:
    - '(?<![\p{L}\p{N}])(?:aber|jedoch|sondern|während|wobei|allerdings|außer|stattdessen)(?![\p{L}\p{N}])'
    - ',\s*(?:die|der|das|den|dem|denen|deren|dessen|welche\p{L}*|weil|dass|damit|um|wo\p{L}*)(?![\p{L}\p{N}])'
    - '(?<![\p{L}\p{N}])nicht\s+nur(?![\p{L}\p{N}])'
    - '(?<![\p{L}\p{N}])(?:und|daher|deshalb)\s+(?:wir|du|sie|ihr|es|unser\p{L}*|dein\p{L}*|euer\p{L}*|diese\p{L}*)(?![\p{L}\p{N}])'
  exclude_context:
    # das Produkt, die Kunden oder ein Team dieses Namens: "Talentpool-Software", "Wir helfen Unternehmen beim Aufbau ihres
    # Talentpools", "Wir bauen eine Plattform für …", "Unsere Software hilft Personalabteilungen beim Aufbau eines Talentpools".
    # The product word stands alone with its article (not "Softwareentwickler für", "Lösungsarchitekten für") and is not the
    # object of "für"/"mit" ("Entwickler für unsere Software für Logistik").
    - '(?<![\p{L}\p{N}])(?:talent|bewerber|kandidaten)-?\s?pool-?\s?(?:software|management|lösung\p{L}*|plattform\p{L}*|tools?|systems?|crm|funktion\p{L}*|team\p{L}*|abteilung)(?![\p{L}\p{N}])'
    - '(?<![\p{L}\p{N}])(?<!(?:für|mit|an|auf|in|bei|von|zu|über)\s+)(?:unsere|eine|die|diese|ihre)\s+(?:plattform|software|saas|app|tool|crm|lösung)(?:e|en|s)?\s+(?:für|zum|zur)(?![\p{L}\p{N}])'
    - '(?<![\p{L}\p{N}])(?:unsere|die|diese|ihre)\s+(?:plattform|software|saas|app|tool|crm|lösung)(?:e|en|s)?\s+(?:hilft|helfen|ermöglicht|ermöglichen|unterstützt|unterstützen|erleichtert|erleichtern|automatisiert|automatisieren|verbindet|verbinden|bringt|bringen)(?![\p{L}\p{N}])'
    # die Anzeige sagt doch, dass es eine echte Stelle ist: "…, aber diese Stelle ist eine konkrete Vakanz"
    - '(?<![\p{L}\p{N}])(?:diese|die)\s+(?:stelle|position|vakanz|anzeige|ausschreibung)\s+ist\s+(?:eine\s+)?(?:konkrete|echte|reale|tatsächliche|bestehende)(?![\p{L}\p{N}])'
    # ein Newsletter-Schluss: "Noch nicht bereit? Bleib in Kontakt", "Abonniere unseren Job-Alert"
    - '(?<![\p{L}\p{N}])(?:noch\s+nicht\s+bereit|bleib\p{L}*\s+(?:in\s+kontakt|auf\s+dem\s+laufenden|informiert)|in\s+kontakt\s+bleiben|job-?\s?(?:alarm|alert|abo)\p{L}*)'
    - '(?<![\p{L}\p{N}])(?:kunden|kundinnen|mandanten|unternehmen|firmen|arbeitgeber\p{L}*|recruiter\p{L}*|personalabteilung\p{L}*|personaler\p{L}*|hr-?\s?(?:teams?|abteilung\p{L}*)|recruiting-?\s?teams?)\s+(?:[\p{L}-]+\s+){0,4}?(?:talent|bewerber|kandidaten)-?\s?pool\p{L}*'
    # eine Aufgabe der Stelle: "Du bist verantwortlich für den Aufbau unseres Talentpools", "Aufbau und Pflege unseres Talentpools"
    - '(?<![\p{L}\p{N}])(?:verantwort\p{L}*|pflegst|pflegen|pflege|betreust|betreuen|baust|managst|kümmerst|übernimmst|unterstützt|unterstützen|entwickelst|gestaltest)(?![\p{L}\p{N}])'
    # die Arbeit einer Recruiterin für den Talentpool: "Als Recruiter sprichst du Kandidaten für unseren Talentpool an", "Du
    # identifizierst und gewinnst Talente für unseren KI-Talentpool" (not "Du bewirbst dich für unseren Talentpool")
    - '(?<![\p{L}\p{N}])(?:du\s+(?:auch\s+|aktiv\s+|gezielt\s+)?(?:sprichst|identifizierst|gewinnst|rekrutierst|qualifizierst|bewertest|sichtest|screenst|akquirierst|vermittelst|interviewst|kontaktierst|recherchierst)|(?:sprichst|identifizierst|gewinnst|rekrutierst|qualifizierst|bewertest|sichtest|screenst|akquirierst|vermittelst|interviewst|kontaktierst|recherchierst)\s+du)\s+(?:[\p{L}-]+\s+){0,4}?(?:für|in|zu)\s+unser(?:en|em|es|e)?\s+(?:[\p{L}-]+\s+){0,2}?(?:\p{L}+-\s?)?(?:talent|bewerber|kandidaten)-?\s?(?:pools?|community|netzwerk\p{L}*)(?![\p{L}\p{N}])'
    # … and opening the sentence, a line (after any bullet) or "Aufgabe:" with the work and the people it is about: "Ansprache von
    # Kandidaten für unseren Talentpool", "Identifikation und Ansprache von Bewerbern für …", "Kandidaten für unseren Talentpool
    # identifizieren und ansprechen". Not "Entwickler für unseren Talentpool gesucht".
    - '(?:^|\n|(?<![\p{L}\p{N}])(?:aufgaben?|rolle|job|fokus|mission)\s*:)(?:[^\S\n]|[*•·–\-▪▫◦‣►▸➢➤✓✔→]|\p{So}|(?:\d{1,3}|[a-z])[.)])*(?:ansprache|ansprechen|direktansprache|identifi\p{L}*|gewinnung|gewinnen|auswahl|auswählen|rekrutier\p{L}*|akquise|akquirier\p{L}*|sichtung|sichten|bewertung|bewerten|vorauswahl|interview\p{L}*|screening|screenen|recherch\p{L}*|sourcing|vermittlung|vermitteln|qualifizier\p{L}*)\s+(?:[\p{L}-]+\s+){0,3}?(?:kandidat\p{L}*|bewerber\p{L}*|talente?n?|fachkr[aä]ft\p{L}*|profile?n?|entwickler\p{L}*|ingenieur\p{L}*|engineers?|expert\p{L}*|spezialist\p{L}*|menschen|personen)\s+(?:[\p{L}-]+\s+){0,2}?(?:für|in)\s+unser(?:en|em|es|e)?\s+(?:[\p{L}-]+\s+){0,2}?(?:\p{L}+-\s?)?(?:talent|bewerber|kandidaten)-?\s?(?:pools?|community|netzwerk\p{L}*)(?![\p{L}\p{N}])'
    - '(?:^|\n|(?<![\p{L}\p{N}])(?:aufgaben?|rolle|job|fokus|mission)\s*:)(?:[^\S\n]|[*•·–\-▪▫◦‣►▸➢➤✓✔→]|\p{So}|(?:\d{1,3}|[a-z])[.)])*(?:kandidat\p{L}*|bewerber\p{L}*|talente?n?|fachkr[aä]ft\p{L}*|profile?n?|entwickler\p{L}*|ingenieur\p{L}*|engineers?|expert\p{L}*|spezialist\p{L}*|menschen|personen)\s+(?:[\p{L}-]+\s+){0,2}?(?:für|in)\s+unser(?:en|em|es|e)?\s+(?:[\p{L}-]+\s+){0,2}?(?:\p{L}+-\s?)?(?:talent|bewerber|kandidaten)-?\s?(?:pools?|community|netzwerk\p{L}*)\s+(?:[\p{L}-]+\s+){0,3}?(?:identifizieren|ansprechen|gewinnen|rekrutieren|auswählen|bewerten|interviewen|sichten|akquirieren|begeistern|qualifizieren|vermitteln)(?![\p{L}\p{N}])'
    # der Schluss einer echten Anzeige: "Keine passende Stelle dabei? Dann bewirb dich initiativ", "Falls aktuell keine offene Stelle …"
    - '(?<![\p{L}\p{N}])(?:kein(?:e|en)?|nicht)\s+(?:die\s+)?(?:passende|richtige|geeignete)\p{L}*'
    - '(?<![\p{L}\p{N}])nichts\s+(?:passendes|dabei|gefunden)(?![\p{L}\p{N}])'
    - '(?<![\p{L}\p{N}])(?:falls|wenn|sofern|sollte|solltest|sollten|ob)(?![\p{L}\p{N}])'
    # Datenschutz und "wir berücksichtigen deine Bewerbung gerne auch für zukünftige Stellen"
    - '(?<![\p{L}\p{N}])(?:datenschutz\p{L}*|dsgvo|einwillig\p{L}*|personenbezogen\p{L}*|speicher\p{L}*|aufbewahr\p{L}*|lösch\p{L}*|widerruf\p{L}*)'
    - '(?<![\p{L}\p{N}])(?:auch|gerne)\s+(?:für|bei)\s+(?:zukünftige|künftige|kommende|spätere|andere)(?![\p{L}\p{N}])'
    # Weiterbildung für spätere Aufgaben ist ein Benefit, keine Stelle: "Gezielte Weiterbildung für zukünftige Positionen im Konzern",
    # "Entwicklungsmöglichkeiten", "Karriereentwicklung", "Persönlichkeitsentwicklung"; "Entwicklung" allein, "Entwicklungsteam",
    # "Softwareentwicklung", "Produktentwicklung" sind die Arbeit selbst
    - '(?<![\p{L}\p{N}])(?:\p{L}*(?:weiterbildung|fortbildung|karriere|vorbereitung|qualifizierung|schulung|training|mentoring|coaching|förderung)\p{L}*|(?:weiter|fort|personal|persönlichkeits|mitarbeiter|führungskräfte)entwicklung\p{L}*|entwicklungs(?:möglichkeit|perspektive|chance|programm|weg|plan|pfad)\p{L}*)\s+(?:[\p{L}-]+\s+){0,3}?(?:für|auf)\s+(?:zukünftige|künftige|kommende|spätere)(?![\p{L}\p{N}])'
    - '(?<![\p{L}\p{N}])(?:berücksichtig\p{L}*|vormerk\p{L}*|in\s+evidenz)(?![\p{L}\p{N}])'
    # Veranstaltungen für eine Community, nicht diese Anzeige: "Organisiere Events für Kandidaten in unserem KI-Talentpool", "Wir
    # veranstalten Workshops für unseren Talentpool", "Wir suchen Mentorinnen für unser Talent-Netzwerk". Wie jede exclude_context-
    # Zeile gilt das für den ganzen Satz: "Bewirb dich für unseren KI-Talentpool und erhalte Einladungen zu Events für unsere
    # Talent-Community" zählt nicht.
    - '(?<![\p{L}\p{N}])(?:mentor\p{L}*|events?|veranstaltung\p{L}*|workshops?|meetups?|webinar\p{L}*|hackathons?|netzwerktreffen|newsletter\p{L}*|stammtisch\p{L}*)\s+(?:[\p{L}-]+\s+){0,3}?(?:für|in|mit|aus)\s+unser(?:en|em|es|e)?\s+(?:[\p{L}-]+\s+){0,2}?(?:\p{L}+-\s?)?(?:talent|bewerber|kandidaten)-?\s?(?:pools?|community|netzwerk\p{L}*)(?![\p{L}\p{N}])'
    - '(?<![\p{L}\p{N}])(?:\p{L}+-\s?)?talent-?\s?(?:pools?|community|netzwerk\p{L}*)-?\s?(?:events?|veranstaltung\p{L}*|workshops?|meetups?|webinar\p{L}*|hackathons?|treffen|newsletter\p{L}*)(?![\p{L}\p{N}])'
  # Eine Qualifikation des Bewerbers bis zum Ende ihres Teilsatzes: "Erfahrung im Aufbau eines Talentpools für zukünftige Stellen",
  # "Berufserfahrung im Aufbau …" zählen nicht, "…, und wir stellen laufend ein" danach schon. Die eigene Erfahrung der Firma ist
  # keine: "Mit unserer Erfahrung in der Entwicklung von KI-Produkten stellen wir laufend ein".
  exclude_clause:
    - '(?<![\p{L}\p{N}])(?=\p{L})(?<!(?<![\p{L}\p{N}])unser\p{L}*\s+(?:\p{L}+\s+)?)(?:\p{L}*erfahrung\p{L}*|kenntnisse|expertise|know-how|praxis)\s+(?:\p{L}+\s+){0,4}?(?:im|in|beim|bei|mit)\s+(?:(?:dem|der|einem|einer)\s+)?(?:aufbau|ausbau|erweiterung|pflege|management|entwicklung|gewinnung)(?![\p{L}\p{N}])'
  # … und endet auch an einem Komma oder Doppelpunkt vor dem Subjekt ("…, wir stellen laufend ein") und an einer Inversion
  # ("… Teams stellen wir laufend ein"; nicht nach "die", "wie", "dass" …: ein Nebensatz). Nur "wir", die Firma: "Kenntnisse im
  # Aufbau von Bewerberpools bringst du für zukünftige Vakanzen mit" bleibt die Qualifikation.
  exclude_clause_ends:
    - '[,:]\s*(?:(?:da|denn|weil|und|aber|deshalb|daher|darum|so|also)\s+)?wir(?![\p{L}\p{N}])'
    - '\s(?=(?!(?:die|der|das|den|dem|denen|deren|dessen|wie|was|wo\p{L}*|dass|ob|als|wenn|weil|da|damit|welche\p{L}*)\s)\p{L}+\s+wir(?![\p{L}\p{N}]))'
  # "Wir suchen laufend Verstärkung – bist du dabei?" und "Bei uns suchen wir laufend …" sind keine Fragen (keys as in the generic
  # pack; das Subjekt darf im Treffer stehen: "suchen wir laufend"); "Suchen Sie ständig neue Mitarbeiter – interessiert?" und
  # "Ständig auf der Suche nach Talenten – neugierig?" (kein "wir") bleiben welche.
  question_tag:
    breaks: ['\s[–—-]\s', '—', ';']
    invitations:
      - '(?:bist\s+du|sind\s+sie|seid\s+ihr)\s+dabei'
      - '(?:(?:hast\s+du|haben\s+sie|habt\s+ihr)\s+)?lust(?:\s+auf\s+(?:mehr|uns|den\s+job|die\s+stelle))?'
      - 'interesse'
      - '(?:(?:haben\s+wir\s+)?(?:dein|ihr)\s+)?interesse\s+geweckt'
      - 'klingt\s+(?:spannend|gut|interessant)'
      - 'interessiert'
      - 'neugierig(?:\s+geworden)?'
      - '(?:klingt|passt)\s+(?:das\s+)?(?:nach|zu)\s+(?:dir|ihnen)'
      - '(?:willst|möchtest)\s+du\s+(?:dabei\s+sein|mitmachen|einsteigen)'
      - 'bereit\s+für\s+(?:den\s+nächsten\s+schritt|uns)'
    openers: [was, 'wie(?!\s+(?:immer|gewohnt))', 'welche\p{L}*', wer, wen, wem, warum, wieso, weshalb, wo, wann, womit, wofür, woher, ist, sind, bist, seid, hast, habt, hat, haben, kannst, könnt, kann, können, willst, wollt, will, wollen, möchtest, möchtet, suchst, sucht, suchen, stellst, stellt, stellen, wirst, wird, werden, gibt, brauchst, braucht, brauchen, findest, findet, finden, kennst, kennt, kennen]
    markers: [also, und, aber, na, ok, okay, nun]
    subjects: [wir, 'unser\p{L}*', uns]
  abbreviations: [z.B, z, B, ca, inkl, bzw, usw, u.a, d.h, ggf, evtl, nr, z.T, bspw, max, min, std, gmbh, mio, tsd]
  # A quick first look (speed): every phrase the evergreen patterns above can match contains one of these (or of the generic pack's).
  prefilter:
    - talent
    - pool
    - initiativ
    - '(?:laufend|ständig|fortlaufend|kontinuierlich|jederzeit|permanent|stets|immer|ganze)'
    - '(?:zukünftig|künftig|kommend|später)'
    - '(?:konkret|bestimmt|offen|aktuell|ausgeschrieben|vakant|spezifisch|fest)'

# Was eine Stellenanzeige zu Visum / Arbeitserlaubnis sagt (German patterns of the visa check; docs/visa-sponsorship.md).
# Regex, case-insensitive with Unicode: word boundaries are (?<![\p{L}\p{N}]) / (?![\p{L}\p{N}]); \b does not know umlauts.
# Compounds are written as stems: Visa-?(?:sponsoring|unterstützung), Visums?unterstützung, \p{L}*visum\p{L}*.
# Keys and `combo` / `list_item` as in the generic pack.
visa:
  offered:
    # "Wir unterstützen dich beim Visumprozess", "Relocation-Support inkl. Visumprozess", "Hilfe bei der Blauen Karte EU"
    - pattern: '(?<![\p{L}\p{N}])(?:bieten|bietet|unterstützen|unterstützt|übernehmen|übernimmt|helfen|hilft|begleiten|begleitet|inkl\.|inklusive|einschließlich|samt|(?:unterstützung|hilfe|support|übernahme|begleitung)\s+(?:bei|beim|für|mit|im|in|zum|zur))(?:\s+[\p{L}\p{N}’''.-]+){0,6}?\s+(?:\p{L}*visum\p{L}*|visums\p{L}*|visa-?(?:sponsoring|unterstützung|antrag|prozess|verfahren|fragen|angelegenheiten)|visasponsoring|blaue[nr]?\s+karte|aufenthalts\p{L}*|arbeitserlaubnis|arbeitsgenehmigung|relocation\p{L}*|umzug\p{L}*)(?![\p{L}\p{N}])'
      combo: true
    # "Visa-Sponsoring ist möglich", "Visumsunterstützung wird angeboten"
    - pattern: '(?<![\p{L}\p{N}])(?:visa|visum|visums)-?\s*(?:sponsoring|sponsorship|unterstützung)\s+(?:ist\s+|wird\s+)?(?:möglich|angeboten|vorhanden|inklusive|gegeben)(?![\p{L}\p{N}])'
      combo: true
    # "Relocation-Paket", "Umzugskostenzuschuss", "Umzugspauschale"
    - pattern: '(?<![\p{L}\p{N}])(?:relocation[-\s]?(?:support|paket|package|unterstützung|service|budget|pauschale)|umzugs-?(?:zuschuss|pauschale|kosten(?:übernahme|erstattung|zuschuss|pauschale)|hilfe|unterstützung|service|paket|budget|bonus))(?![\p{L}\p{N}])'
      combo: true
    # A list item that is only the noun: "- Visasponsoring", "- Visa-Unterstützung"
    - pattern: '^(?:visa|visum|visums)-?\s*(?:sponsoring|unterstützung)(?:\s+(?:und|&|\+)\s+relocation\p{L}*)?\s*[.!]?$'
      combo: true
      list_item: true
  not_offered:
    no_sponsorship:
      # "Ein Visa-Sponsoring ist leider nicht möglich"
      - pattern: '(?<![\p{L}\p{N}])(?:visa|visum|visums)-?\s*(?:sponsoring|sponsorship|unterstützung)\s+(?:ist|wird|kann)\s+(?:leider\s+|derzeit\s+|aktuell\s+|grundsätzlich\s+)*(?:nicht|kein\p{L}*)(?![\p{L}\p{N}])'
        combo: true
      # "Wir bieten kein Visum-Sponsoring an", "unterstützen wir leider nicht bei Visa-Fragen"
      - '(?<![\p{L}\p{N}])(?:bieten|bietet|können|übernehmen|unterstützen|ermöglichen|sponsern)\s+(?:wir\s+|ihr\s+|dir\s+|ihnen\s+)?(?:leider\s+|derzeit\s+|aktuell\s+)*(?:kein\p{L}*|nicht)(?:\s+[\p{L}\p{N}’''-]+){0,3}?\s+(?:\p{L}*visum\p{L}*|visa\p{L}*|visa-\p{L}+|sponsoring|arbeitserlaubnis|blaue[nr]?\s+karte)(?![\p{L}\p{N}])'
      # "keine Visumsunterstützung"
      - pattern: '(?<![\p{L}\p{N}])kein(?:e|en)?\s+(?:\p{L}*visum\p{L}*|visa-?(?:sponsoring|unterstützung)|visasponsoring|sponsoring\s+(?:für|von)\s+(?:visa|visum|arbeits\p{L}*))(?![\p{L}\p{N}])'
        combo: true
      - pattern: '(?<![\p{L}\p{N}])(?:visa|visum)(?:-?sponsoring|-?unterstützung)?\s*:\s*(?:nein|nicht\s+möglich|kein\p{L}*)(?![\p{L}\p{N}])'
        combo: true
      # "Ein Relocation-Paket bieten wir, eine Visumsunterstützung jedoch nicht."
      - pattern: '(?:visum|visa)[\p{L}-]*\s+(?:jedoch|aber|allerdings)\s+(?:leider\s+)?(?:nicht|kein\p{L}*)(?![\p{L}\p{N}])'
        combo: true
    permit_required:
      # "Eine Arbeitserlaubnis ist Voraussetzung", "Eine gültige Arbeitserlaubnis für Deutschland wird vorausgesetzt"
      - pattern: '(?<![\p{L}\p{N}])(?:arbeitserlaubnis|arbeitsgenehmigung|aufenthalts-?\s*(?:und\s+arbeitserlaubnis|titel|genehmigung))(?:\s+[\p{L}\p{N}-]+){0,4}?\s+(?:ist|wird)\s+(?:zwingend\s+)?(?:voraussetzung|erforderlich|notwendig|vorausgesetzt|zwingend)(?![\p{L}\p{N}])'
        combo: true
      # "Du besitzt eine gültige Arbeitserlaubnis"
      - pattern: '(?<![\p{L}\p{N}])(?:besitzt|besitzen|verfügst\s+über|verfügen\s+über)\s+(?:bereits\s+)?(?:eine\s+)?(?:gültige\s+)?(?:arbeitserlaubnis|arbeitsgenehmigung|aufenthalts-?\s*(?:und\s+arbeitserlaubnis|titel|genehmigung))(?![\p{L}\p{N}])'
        combo: true
      # "Voraussetzung ist eine gültige Arbeitserlaubnis"
      - pattern: '(?<![\p{L}\p{N}])(?:voraussetzung|erforderlich)\s*(?:ist|sind|:)?\s*(?:eine\s+)?(?:gültige\s+)?(?:arbeitserlaubnis|arbeitsgenehmigung|aufenthaltstitel)(?![\p{L}\p{N}])'
        combo: true
      # "Du benötigst eine gültige Arbeitserlaubnis", "Du brauchst eine Arbeitserlaubnis"
      - pattern: '(?<![\p{L}\p{N}])(?:benötigst|brauchst|benötigen|brauchen)\s+(?:du\s+|sie\s+)?(?:bereits\s+)?(?:eine\s+)?(?:gültige\s+)?(?:arbeitserlaubnis|arbeitsgenehmigung|aufenthalts-?\s*(?:und\s+arbeitserlaubnis|titel|genehmigung))(?![\p{L}\p{N}])'
        combo: true
      # "Aufenthalts- und Arbeitserlaubnis vorhanden" in a list of requirements (not "Keine Arbeitserlaubnis vorhanden?")
      - pattern: '(?<![\p{L}\p{N}])(?<!(?:kein\p{L}*|ohne)\s+)(?:arbeitserlaubnis|arbeitsgenehmigung|aufenthalts-?\s*(?:und\s+arbeitserlaubnis|titel|genehmigung))\s+(?:ist\s+|muss\s+)?vorhanden(?:\s+sein)?(?![\p{L}\p{N}])(?!\s*\?)'
        combo: true
      # "Du musst in Deutschland arbeitsberechtigt sein"
      - pattern: '(?<![\p{L}\p{N}])(?:musst|müssen|solltest|sollten)(?:\s+[\p{L}]+){0,3}?\s+arbeitsberechtigt(?![\p{L}\p{N}])'
        combo: true
  permit_alternatives:
    - '(?<![\p{L}\p{N}])oder(?:\s+[\p{L}\p{N}-]+){0,4}?\s+(?:blaue[nr]?\s+karte|visum|visa|aufenthalts\p{L}*|beantrag\p{L}*)(?![\p{L}\p{N}])'
    - '(?<![\p{L}\p{N}])bei\s+bedarf\s+(?:unterstütz|helfen|hilft|begleit)\p{L}*'
  mention_terms:
    - '(?<![\p{L}\p{N}])(?:visum|visums)(?![\p{L}\p{N}])'
    - pattern: '(?<![\p{L}\p{N}])(?:\p{L}+visum|visums\p{L}+|visa-\p{L}+)(?![\p{L}\p{N}])'
      combo: true
  mention_context:
    - '(?<![\p{L}\p{N}])unterstütz\p{L}*'
    - '(?<![\p{L}\p{N}])blaue[nr]?\s+karte(?![\p{L}\p{N}])'
    - '(?<![\p{L}\p{N}])arbeitserlaubnis(?![\p{L}\p{N}])'
    - '(?<![\p{L}\p{N}])aufenthaltstitel(?![\p{L}\p{N}])'
    - '(?<![\p{L}\p{N}])beantrag\p{L}*'
  negation_cues:
    - nicht
    - nein
    - 'kein\p{L}*'
    - leider
    - ohne
  clause_breaks:
    - '(?<![\p{L}\p{N}])(?:aber|jedoch|sondern|während|wobei|allerdings|außer)(?![\p{L}\p{N}])'
    - '(?<![\p{L}\p{N}])und\s+(?:wir|du|sie|ihr|es|unser\p{L}*|dein\p{L}*|euer\p{L}*)(?![\p{L}\p{N}])'
  exclude_context:
    - '(?<![\p{L}\p{N}])sponsoring\s+von\s+(?:veranstaltungen|events?|konferenzen)(?![\p{L}\p{N}])'
    - '(?<![\p{L}\p{N}])visa\s*(?:/|,|&|und|oder)\s*(?:master\s*card|amex|american\s+express|maestro|girocard)(?![\p{L}\p{N}])'
    # "Wir unterstützen Unternehmen bei der Relocation ihrer Fachkräfte", "Du unterstützt unser Immigration-Team"
    - '(?<![\p{L}\p{N}])(?:kunden|kundinnen|mandanten|unternehmen|firmen|arbeitgeber|arbeitgebern)\s+(?:bei|mit|im|in)\s+(?:[\p{L}-]+\s+){0,3}?(?:\p{L}*visum|visa|aufenthalt|relocation|umzug|einwanderung|immigration)'
    - '(?<![\p{L}\p{N}])(?:unterstützt|unterstützen|verstärkst|verstärken)\s+(?:unser|unsere|das)\s+\p{L}*(?:immigration|relocation|visa|mobility)\p{L}*[-\s]?team(?![\p{L}\p{N}])'
  abbreviations: [z.B, z, B, ca, inkl, bzw, usw, u.a, d.h, ggf, evtl, nr, z.T, bspw, max, min, std, gmbh, mio, tsd]
  # A quick first look (speed): a JD or sentence with none of these (or of the generic pack's) is skipped. Every phrase the
  # patterns above can match contains one of them; keep it so when you add a pattern.
  prefilter:
    - visum
    - visa
    - sponsor
    - relocat
    - umzug
    - 'blaue[nr]?\s+karte'
    - aufenthalt
    - arbeitserlaubnis
    - arbeitsgenehmigung
    - arbeitsberechtigt
