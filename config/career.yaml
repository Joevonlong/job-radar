# File format version.
config_version: 2
enabled: false
# Total running time for an extraction or tailoring request.
timeout_seconds: 600
# Margin before an abandoned running request expires.
expiry_grace_seconds: 60
# Maximum wait for a queued request.
queue_timeout_seconds: 900
# Upload and extraction limits.
import:
  # Accepted file extensions.
  formats: [pdf, md, txt]
  # Maximum uploaded file size in bytes.
  max_file_bytes: 2000000
  # Maximum time to read an upload.
  upload_timeout_seconds: 30
  # Maximum source text length.
  max_chars: 30000
  # Minimum source text length.
  min_chars: 20
  # Maximum time to parse a PDF.
  pdf_timeout_seconds: 15
  # Maximum PDF parser memory in megabytes.
  pdf_max_memory_mb: 256
  # Maximum simultaneous uploads.
  max_concurrent_uploads: 2
  # Days before an unreviewed draft expires.
  draft_ttl_days: 14
  # Maximum unreviewed drafts.
  max_pending_drafts: 5
  # Output token budget share at which truncation is suspected.
  output_truncated_share: 0.95
  # Shorter work authorization and availability values are highlighted only.
  stored_value_min_chars: 3
  # Title lines that must never be guessed as a person's name.
  title_words: [Lebenslauf, Curriculum Vitae, CV, Resume, Résumé, Tabellarischer Lebenslauf]
  # Labels that are highlighted without replacing their values.
  sensitive_labels: [Geburtsdatum, Geburtsort, Staatsangehörigkeit, Nationalität, Familienstand, Anschrift, Date of birth, Place of birth, Nationality, Marital status, Address]
# Limits checked whenever the career profile is saved.
profile:
  # Maximum number of entries across profile sections.
  max_entries: 100
  # Maximum bullets within one entry.
  max_bullets_per_entry: 30
  # Maximum alternative wordings of one text.
  max_wordings_per_text: 10
  # Maximum characters in a text value.
  text_max_chars: 4000
# Local profile version retention.
history:
  # Maximum versions kept, oldest removed first.
  keep_versions: 50
# Evidence verification limits for extraction.
evidence:
  # Minimum supporting quote length.
  min_quote_chars: 4
  # Maximum supporting quote length.
  quote_max_chars: 160
  # Figure units use the same scale and multiple defaults as writer.yaml.
  figure_units:
    # Magnitude suffixes mapped to their numeric scale.
    scale: { 万: 10000, 萬: 10000, 亿: 100000000, 億: 100000000, 千: 1000, thousand: 1000, tausend: 1000, m: 1000000, mn: 1000000, mio: 1000000, million: 1000000, millionen: 1000000, b: 1000000000, bn: 1000000000, mrd: 1000000000, billion: 1000000000, milliarden: 1000000000 }
    # Suffixes expressing a multiple rather than a magnitude.
    multiple: [倍, x]
# Résumé document limits and initial layout.
document:
  # Maximum number of saved documents.
  max_documents: 100
  # Maximum photo or signature size in bytes.
  image_max_bytes: 2000000
  # Maximum preview request body in bytes. Document saves carry at most 1 MB, like profile saves.
  max_request_bytes: 4000000
  # Initial layout for new documents and missing preferences.
  defaults:
    # Document language.
    lang: en
    # Rendering theme.
    theme: classic
    # Accent color.
    accent: "#2f54eb"
    # Target page count.
    pages: 1
    # Paper format.
    paper: a4
    # Content density.
    density: normal
# Preview timing.
preview:
  # Delay before updating a preview in milliseconds.
  debounce_ms: 400
# JD tailoring and evidence verification.
tailor:
  # Maximum separate instructions saved in a document.
  max_requirements: 10
  # Maximum characters in one separate instruction.
  requirement_max_chars: 500
  # Minimum content-word coverage by supporting quotes; provisional pending model calibration.
  duty_min_coverage: 0.7
  # Maximum suggestions retained from one request.
  max_proposals: 100
  # Maximum cleaned JD characters sent to the provider.
  jd_max_chars: 6000
  # Share of a truncated JD taken from its beginning.
  jd_head_share: 0.7
  # First-person words excluded from name detection, by language.
  first_person:
    # English first-person words.
    en: [i, "i'm", "i've", "i'd", my, me, myself]
    # German first-person words.
    de: [ich, mein, meine, meinen, meinem, meiner, mich, mir]
  # Name shapes checked against the complete factual pool.
  names:
    # Treat quoted text as a name.
    quoted: true
    # Detect inner capitals, digits and acronyms.
    mixed_tokens: true
    # Capitalized-name policy by language.
    capitalized_non_initial:
      # Detect individual capitalized words in other languages.
      default: single
      # German nouns require consecutive capitalized words.
      de: multi
    # Tokens excluded from name detection.
    stopwords: [I, OK]
  # Grammatical words excluded from lexical coverage, by language.
  stopwords:
    # English grammatical words.
    en: [a, an, the, and, or, of, to, in, on, at, for, with, by, from, as, is, are, was, were, be, been, being, have, has, had, this, that, these, those, i, my, we, our, you, your, it, its]
    # German grammatical words.
    de: [der, die, das, den, dem, des, ein, eine, einen, einem, einer, eines, und, oder, mit, von, zu, zur, zum, für, in, im, auf, an, am, als, bei, aus, ist, sind, war, waren, sein, hat, haben, ich, mein, meine, wir, unser, sie, ihre]
