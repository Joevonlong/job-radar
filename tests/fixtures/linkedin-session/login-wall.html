<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8"><title>LinkedIn Login, Sign in | LinkedIn</title></head>
<body class="">
<main class="app__content">
  <h1>Sign in</h1>
  <p class="headline__sub-title">Stay updated on your professional world</p>
  <form class="login__form" action="/checkpoint/lg/login-submit" method="post">
    <label for="username">Email or phone</label><input id="username" name="session_key" type="text" autocomplete="username">
    <label for="password">Password</label><input id="password" name="session_password" type="password" autocomplete="current-password">
    <button type="submit">Sign in</button>
  </form>
  <a href="/signup">New to LinkedIn? Join now</a>
</main>
</body>
</html>
