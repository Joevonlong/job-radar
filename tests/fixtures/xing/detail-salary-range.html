<script data-ch type="application/ld+json">{"@context":"https://schema.org/","@type":"JobPosting","title":"AI Solution Engineer (f/m/d)","description":"\n    <h2>Deine Rolle bei uns</h2>\n<p>Wir suchen einen AI Solution Engineer (f/m/d), der mit Leidenschaft bei der Sache ist und bereit ist, Verantwortung zu übernehmen.<br>\nBei Belegwerk arbeiten unsere AI Solution Engineers im Onboarding direkt mit unseren Kunden zusammen, um unser Produkt zu konfigurieren und anzupassen. Belegwerk ist ein erfundenes Beispielunternehmen; dieser Text ist für ein Test-Fixture geschrieben und beschreibt keine echte Stelle.</p>\n<h2>Deine Aufgaben</h2>\n<p>Du bist für die Implementierung und Integration unserer KI-basierten Software verantwortlich und identifizierst proaktiv Prozess- und Produktverbesserungen.</p>\n<p>Deine Aufgaben im Überblick:</p>\n<ul>\n<li>Du unterstützt unsere Kunden bei der Anbindung ihrer bestehenden IT-Systeme (ERP) an unsere Software (Import, Export, API-Dokumentation, Workshops mit Kunden)</li>\n<li>Du bist technische Ansprechperson für unsere Kunden und stellst sicher, dass unsere Software mit der bestehenden IT-Infrastruktur kompatibel und datenschutzkonform ist</li>\n<li>Du analysierst neue Anwendungsfälle (\"Use Cases\"), die einen Mehrwert schaffen können</li>\n<li>Du arbeitest eng mit dem Product &amp; Engineering Team zusammen, um spezifische Problemstellungen zu verstehen</li>\n</ul>\n<h2>Dein Profil</h2>\n<p>Wir suchen dich als Teamplayer, der sich in einer agilen Arbeitswelt wohlfühlt.</p>\n<p>Das bringst du mit:</p>\n<ul>\n<li>Du hast erste Erfahrungen (+1 Jahr) im Solution Engineering gesammelt</li>\n<li>Du verfügst über gute Programmiererfahrung in Python</li>\n<li>Du hast Erfahrung oder Interesse an der Arbeit mit KI zur Lösung von Geschäftsproblemen</li>\n<li>Du sprichst fließend Deutsch und Englisch (Muttersprache oder mindestens C1)</li>\n</ul>\n<h2>Unsere Benefits &amp; Kultur</h2>\n<h2>Was wir bieten</h2>\n<ul>\n<li>\n<strong>Modernes Büro:</strong> Ergonomische Arbeitsplätze, eine Lounge mit Kaffee und Getränken und Platz für Kreativpausen.</li>\n<li>\n<strong>Flexible Arbeitszeiten:</strong> Gestalte deinen Arbeitstag flexibel.</li>\n<li>\n<strong>Office, Remote &amp; Workation:</strong> Du entscheidest selbst, ob du im Büro oder remote arbeitest; vier Wochen im Jahr auch aus dem Ausland.</li>\n<li>\n<strong>Steuerfreie Sachbezüge:</strong> Wähle zwischen einem Gutschein oder einer Sportmitgliedschaft.</li>\n<li>Dein Entwicklungspotenzial: Wir ermöglichen dir ein Personal Development Budget pro Jahr.</li>\n</ul>","datePosted":"2026-10-07T05:03:30Z","directApply":true,"url":"https://www.xing.com/jobs/berlin-ai-solution-engineer-90100004","validThrough":"2026-11-20T03:54:07Z","industry":"Informationsdienste","employmentType":"FULL_TIME","hiringOrganization":{"@type":"Organization","name":"Belegwerk GmbH","logo":"https://www.xing.com/assets/companies/img/default-logo_96x96.png"},"baseSalary":{"@type":"MonetaryAmount","currency":"EUR","value":{"@type":"QuantitativeValue","minValue":50000,"maxValue":65000,"unitText":"YEAR"}},"jobLocation":[{"@type":"Place","address":{"@type":"PostalAddress","streetAddress":null,"addressLocality":"Berlin","addressRegion":"Land Berlin","postalCode":null,"addressCountry":"DE"}}]}</script>
