oud, Container und Serverless-Deployments</P></DIV></DIV><DIV><H2>Das bringst du mit</H2><DIV><P><STRONG>Must-have – auf Junior-Level:</STRONG></P><UL><LI><STRONG>Erfahrung in der Entwicklung KI-basierter Anwendungen mit Large Language Models </STRONG>– Prompt Engineering, Tool Use, Agentic-Coding-Patterns.</LI><LI>Du hast mindestens ein KI-System selbst gebaut – auch aus Studium oder Nebenprojekt.</LI><LI><STRONG>Solide Full-Stack-Kompetenz:</STRONG> Backend (Python, Node.js o. ä.) und Frontend (React, Vue o. ä.).</LI><LI>Kommunikation auf Deutsch (ab C1) und Englisch (ab B2).</LI><LI>Abgeschlossenes Studium im Bereich (Wirtschafts-)Informatik, Data Science, KI oder mit vergleichbarem technischem Fokus.</LI></UL><P><STRONG>Zusätzlich auf Senior-Level:</STRONG></P><UL><LI><STRONG>Mehrjährige Praxiserfahrung im Design und Betrieb produktiver AI-Systeme.</STRONG></LI><LI>MLOps-Erfahrung: Betrieb von KI-Modellen in Produktionsumgebungen, Monitoring, Kostenkontrolle.</LI></UL><P><STRONG>Für wen diese Stelle nichts ist</STRONG></P><UL><LI><STRONG>Wenn du KI-Konzepte schreiben willst, ohne sie zu bauen</STRONG>: Das ist die Rolle der Consultants.</LI><LI><STRONG>Wenn du bauen willst, ohne zu betreiben: </STRONG>Was du hier entwickelst, läuft danach.</LI></UL></DIV></DIV><DIV><H2>Warum das AI Booster Team & Über uns</H2><DIV><UL><LI><STRONG>Du bist näher am Code als in jeder Beratungsrolle. </STRONG></LI><LI><STRONG>Remote ist bei uns möglich:</STRONG> deutschlandweit, hybrid oder vollständig remote.</LI><LI><STRONG>Weitere Benefits: </STRONG>Flexible Arbeitsmodelle · Sabbaticals · Coaching · JobRad u. v. m.</LI></UL><P><STRONG>Über uns</STRONG></P><P>Verbund Consulting ist ein erfundenes Beratungsunternehmen für Testdaten.</P><P><STRONG>Bewirb dich jetzt mit wenigen Klicks.</STRONG></P><P><SUP>* Bei uns ist jeder unabhängig von Herkunft, Geschlecht, sexueller Orientierung, Handicap, Religion und Alter willkommen.<BR></SUP></P></DIV></DIV><DIV><H2>Dein persönlicher Kontakt
