    veto: true
    text: "This role is 100% on-site in our Munich office."
  - lang: de
    veto: true
    text: "Die Stelle ist zu 100 % vor Ort in Hamburg."
  - lang: en
    veto: false
    text: "Hybrid: two days on-site, the rest remote."
  - lang: de
    veto: false
    text: "100 % Remote möglich, gelegentlich vor Ort."

