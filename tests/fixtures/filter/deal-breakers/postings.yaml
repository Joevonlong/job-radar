# Posting snippets for the deal-breaker tests (made-up text, no real company). `veto`: whether the rule of the group vetoes it.

# The travel example of docs/deal-breakers.md: 'Reisetätigkeit.{0,30}(?:[5-9]\d|100)\s?%' and 'travel.{0,30}(?:[5-9]\d|100)\s?%'
travel:
  - lang: de
    veto: true
    text: "Ihre Aufgaben: Betreuung von Kunden in ganz Europa. Reisetätigkeit von bis zu 60 % ist Teil der Rolle."
  - lang: de
    veto: true
    text: "Wir bieten ein starkes Team. Reisetätigkeit: ca. 100% beim Kunden vor Ort."
  - lang: de
    veto: false
    text: "Reisetätigkeit ca. 20 % innerhalb Deutschlands. Homeoffice möglich."
  - lang: de
    veto: false
    text: "Keine Reisetätigkeit. Dafür 30 Tage Urlaub im Jahr."
  - lang: en
    veto: true
    text: "You will support customers on site. Expect travel up to 75% of the time."
  - lang: en
    veto: true
    text: "Travel: 50% across the DACH region."
  - lang: en
    veto: false
    text: "Occasional travel (10% of the time) to our Berlin office."
  - lang: en
    veto: false
    text: "No travel required. 30 days of vacation a year."

# 'phrase' with patterns ['100\s?%\s*(?:on-?site|vor Ort)'], scope description
onsite:
