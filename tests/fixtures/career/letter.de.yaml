  subject: Bewerbung als Senior AI Engineer (m/w/d) – Kennziffer 4711
  salutation: Sehr geehrte Frau Muster,
  body:
    - >-
      in Ihrer Ausschreibung suchen Sie jemanden, der einen Dokumenten-Assistenten für Ihre Kunden aus der
      Versicherungsbranche vom Prototyp in den stabilen Betrieb bringt. Genau das ist heute meine Aufgabe: Bei
      Northwind Analytics leite ich den Dokumenten-Agenten, den **über 40 Unternehmenskunden** einsetzen und der ihre
      manuelle Prüfzeit um **63 %** gesenkt hat.
    - >-
      Was ich bei der Example GmbH vor allem einbringen möchte, ist Messbarkeit. Für unseren hybriden Retrieval-Stack
      aus BM25, Embeddings und Reranker habe ich ein Eval-Set mit 1.200 Fragen aufgebaut; die Antwortgenauigkeit stieg
      von 71 % auf 89 %. Modell-Routing und Prompt-Caching senkten die Inferenzkosten pro Anfrage bei gleicher Qualität
      um 48 %. Bei Fieldline habe ich das erste Offline-Evaluations-Framework des Teams entworfen und ein Modell zur
      Ticket-Triage mit 12.000 Tickets pro Tag in Produktion gebracht.
    - >-
      Ihr Team arbeitet mit Python, AWS und Claude – damit arbeite ich täglich in Produktion. In meinem
      Open-Source-Projekt Receipt Copilot ordnet ein Agent deutsche Belege Buchungskategorien zu; dort habe ich gelernt,
      wie genau ein System deutsche Dokumente lesen muss, bevor man ihm eine Entscheidung überlässt.
      Für die Arbeit mit Coding-Agenten pflege ich eine geprüfte Bibliothek von Skills und Leitplanken.
    - >-
      Ich kann die Stelle ab 01/2027 antreten. Meine Gehaltsvorstellung liegt bei 78.000 € brutto im Jahr. Ich freue
      mich darauf, Ihnen im Gespräch zu zeigen, wie ich Evals und Kostenbudgets von Anfang an mitplane.
  closing: Mit freundlichen Grüßen
