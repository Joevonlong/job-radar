# 岗位拆解（docs/breakdown.md）：用 AI 把一条 JD 拆成工作内容、技术栈（按类别）、经验、项目 / 成果、软技能、语言和其他要求，
# 每一项标明"必须"还是"加分"，并附 JD 原文引用（引用对不上原文的项会被丢掉）。只发 JD，不发你的画像；"已具备 / 待补强"在本地对照。
# 默认关闭：拆解要花 token 和时间，需要时再打开。
# 用哪个 AI、按什么顺序试：ai.yaml 的 tasks.breakdown（不写就沿用全局顺序），也可以在 /settings 的 AI 标签"任务覆盖"里改。
# 保存后约 5 秒生效（runner / ai-worker 热加载；网页每次打开详情页时重读本文件）。

# 总开关。false：详情页不提供拆解按钮、也不自动拆解；已经拆好的结果仍然显示（只读）
enabled: false

# manual：只在详情页点"拆解这个岗位"时分析。
# auto：另外在每轮处理的最后（翻译之后），给高分岗位自动拆解，受下面 auto 的门槛和上限限制
mode: manual

auto:
  # 只自动拆解排序值不低于这个分数的岗位（和 ai.yaml 的 translate_auto_min_score 是同一个尺度）
  min_rank: 80
  # 每轮最多自动拆解几条，按排序值从高到低；没拆完的下一轮继续
  per_cycle_limit: 5

# 发给 AI 的 JD 最长多少字符；更长的只保留开头和结尾（要求常写在结尾）
jd_max_chars: 12000
# 截断时开头占的比例，其余取自结尾
jd_head_share: 0.7
# 一次拆解最多等多久（秒）；超时就换下一个服务商
timeout_seconds: 240
