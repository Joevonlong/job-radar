# 德国规则：德语的公司后缀、中介、合同说法，远程范围外标记和"在德国 / 欧盟受雇"的正文说法。

company:
  legal_suffixes: [gmbh, mbh, ag, se, kg, kgaa, ug, ohg, gbr, ev]
  agency_names: [Gulp, Haystack, Rocken, Instaffo]
agency:
  company_name_patterns:
    - personalberatung
    - personalvermittlung
    - personaldienstleist
    - personalmanagement
    - \bzeitarbeit
  text_patterns:
    - für unseren kunden
    - für (?:unseren|meinen|einen unserer) mandanten
    - im auftrag (?:unseres|eines|meines|unserer) (?:kunden|kundin|mandanten|klienten|auftraggebers)
    - im auftrag eines? unserer (?:kunden|mandanten)
    - für einen? (?:unserer |meiner )?(?:kunden|mandanten|klienten|auftraggeber)\b
    - unser(?:e)? (?:kunde|kundin|mandant|auftraggeber) (?:ist|sucht|bietet)\b
    - \bim kundenauftrag\b
    - \bim auftrag (?:eines|einer|von) (?:kunden|kundin|unseres|unserer)
    - \b(?:für|fuer) (?:einen|eine) (?:unserer )?(?:renommierten |namhaften )?(?:kunden|kundin)\b
    - \bpersonalberatung\b
    - \bpersonalvermittlung\b
    - \bpersonaldienstleister\b
  exclude_context_patterns:
    - \bunaufgefordert\w*
    - \bkeine\b[^.\n]{0,60}\b(?:personalberat|personalvermittl|personaldienstleist|headhunter|agentur)
    - \bnicht (?:akzeptier|annehmen|berücksichtig)
    - \bohne (?:personalberat|personalvermittl|personaldienstleist|agentur)
contract:
  student:
    - \bwerkstudent
    - praktik(?:um|ant)
    - \bpflichtpraktik
    - \bausbildung\b
    - \bauszubildende
    - \bazubi\b
    - \bduales? studium\b
    - abschlussarbeit
    - \b(?:master|bachelor)arbeit
  temp_agency:
    - \bzeitarbeit
    - arbeitnehmerüberlassung
    - arbeitnehmerueberlassung
  direct_hire:
    - \b(?:vertragsart|anstellungsart|beschäftigungsart|art der anstellung|anstellungsverhältnis|employment type|contract type)\s*:\s*(?:personalvermittlung|direktvermittlung|direct hire|direct placement)\b
    - \bdirektvermittlung\b
    - \bim rahmen (?:der|einer) (?:direkten )?personalvermittlung\b
    - \b(?:direkte|feste) (?:festanstellung|anstellung|einstellung) (?:bei|beim) (?:unserem|unserer|unseren|dem|der) (?:kunden|kundin|mandanten|auftraggeber)
  freelance:
    - \bfreiberuf
    - \bfreie[rn]? mitarbeit
  fixed_term:
    - \bbefristet
    - \bzeitvertrag\b
    - \bbefristete[nrs]? (?:vertrag|stelle|anstellung|arbeitsvertrag)
    - \bmutterschaftsvertretung\b
    - elternzeitvertretung
  permanent:
    - \bunbefristet
    - \bfestanstellung\b
    - \bunbefristete[nrs]? (?:vertrag|stelle|anstellung|arbeitsvertrag)
    - \bdauerstelle\b
    - \bfeste anstellung\b
    - \b(?:employment|job|contract|position)[\s-]*(?:type)?\s*:\s*(?:permanent|festanstellung)\b
    - \b(?:employment|job|contract|position)[\s-]*(?:type)?\s*:[^\n:]{0,40}\b(?:permanent|festanstellung|unbefristet)\b
    - \b(?:art der anstellung|anstellungsart|beschäftigungsart|vertragsart|anstellungsverhältnis)\s*:\s*(?:unbefristet|festanstellung|permanent)
filter:
  generic_location_patterns:
    - ^\W*(?:mehrere standorte|flexibel)\W*$
  remote:
    worldwide_patterns:
      - \bweltweit\b
    outside_patterns:
      - \busa\b
      - \bu\.s\.
      - \bunited states\b
      - \bthe us\b
      - \bnorth america\b
      - \bamericas?\b
      - \blatam\b
      - \bcanada\b
      - \bapac\b
      - \basia\b
      - \bindia\b
      - \bsingapore\b
      - \baustralia\b
      - \bnew zealand\b
      - \bmiddle east\b
      - \bafrica\b
      - \b(?:colombia|mexico|brazil|brasil|argentina|chile|peru|uruguay|costa rica|panama|ecuador|venezuela|bolivia|paraguay|guatemala)\b
      - \b(?:japan|tokyo|korea|seoul|china|beijing|shanghai|hong kong|taiwan|vietnam|thailand|bangkok|malaysia|kuala lumpur|indonesia|philippines|manila|pakistan|bangladesh|sri lanka)\b
      - \b(?:israel|tel aviv|saudi|riyadh|dubai|uae|emirates|qatar|egypt|nigeria|kenya|south africa|morocco|ghana)\b
      - \b(?:toronto|vancouver|montreal|ottawa|ontario|british columbia|quebec|alberta)\b
      - \b(?:new york|san francisco|los angeles|seattle|austin|boston|denver|chicago|atlanta|dallas|houston|miami|washington|mountain view|palo alto|san jose|san diego|portland|philadelphia|phoenix|salt lake|raleigh|pittsburgh|minneapolis|detroit|nashville|charlotte|brooklyn|cambridge, ma|boulder|sunnyvale|menlo park|redwood city|bellevue|arlington|reston|mclean|edison)\b
      - \b(?:alabama|alaska|arizona|arkansas|california|colorado|connecticut|delaware|florida|hawaii|idaho|illinois|indiana|iowa|kansas|kentucky|louisiana|maine|maryland|massachusetts|michigan|minnesota|mississippi|missouri|montana|nebraska|nevada|new hampshire|new jersey|new mexico|north carolina|north dakota|ohio|oklahoma|oregon|pennsylvania|rhode island|south carolina|south dakota|tennessee|texas|utah|vermont|virginia|wisconsin|wyoming)\b
      - \b(?:east coast|west coast|midwest|northeast|southeast|southwest|northwest|central) - (?:united states|us|usa)\b
    title_outside_patterns:
      - (?:^|[-–—|,(/:])\s*(?:us|usa|u\.s\.(?:a\.)?|united states|north america|americas|latam|latin america|canada|apac|asia|india|brazil|mexico|australia)(?:\s+(?:east|west|central)(?:\s+coast)?)?(?:\s+(?:remote|only|based))?\s*(?:$|[-–—|,)/])
      - \b(?:us|u\.s\.) (?:east|west|central) coast\b
      - \b(?:east|west) coast\b
      - \b(?:us|usa|u\.s\.|canada)[- ](?:based|only|remote)\b
    description_in_scope_patterns:
      - \b(?:remote(?:ly)?|work(?:ing)? remotely|work from (?:home|anywhere)|home ?office)\W{0,3}(?:from|within|in|across|throughout)\s+(?:anywhere\s+in\s+)?(?:the\s+)?(?:germany|deutschland|eu|european union|europe|eea)\b
      - \b(?:germany|deutschland|eu|european union|europe|eea)[- ](?:wide|remote)\b
      - \b(?:hir(?:e|ing)|employ(?:ing|ment)?|candidates?|residents?)\b[^.\n]{0,30}\b(?:in|within|across|throughout)\s+(?:the\s+)?(?:germany|deutschland|eu|european union|europe|eea)\b
      - \b(?:hir(?:e|ing)|candidates?|apply from|work from|employees? in)\b[^.\n]{0,80}\b(?:germany|deutschland)\b
      - \b(?:deutschlandweit|bundesweit)\b[^.\n]{0,30}\b(?:remote|home ?office|mobil)
      - \bremote\b[^.\n]{0,15}\b(?:aus|in|innerhalb)\s+(?:deutschland|der eu|europa)\b

visa:
  offered:
    # "Wir unterstützen dich beim Visumprozess", "Relocation-Support inkl. Visumprozess", "Hilfe bei der Blauen Karte EU"
    - pattern: '(?<![\p{L}\p{N}])(?:bieten|bietet|unterstützen|unterstützt|übernehmen|übernimmt|helfen|hilft|begleiten|begleitet|inkl\.|inklusive|einschließlich|samt|(?:unterstützung|hilfe|support|übernahme|begleitung)\s+(?:bei|beim|für|mit|im|in|zum|zur))(?:\s+[\p{L}\p{N}’''.-]+){0,6}?\s+(?:\p{L}*visum\p{L}*|visums\p{L}*|visa-?(?:sponsoring|unterstützung|antrag|prozess|verfahren|fragen|angelegenheiten)|visasponsoring|blaue[nr]?\s+karte|aufenthalts\p{L}*|arbeitserlaubnis|arbeitsgenehmigung|relocation\p{L}*|umzug\p{L}*)(?![\p{L}\p{N}])'
      combo: true
    # "Visa-Sponsoring ist möglich", "Visumsunterstützung wird angeboten"
    - pattern: '(?<![\p{L}\p{N}])(?:visa|visum|visums)-?\s*(?:sponsoring|sponsorship|unterstützung)\s+(?:ist\s+|wird\s+)?(?:möglich|angeboten|vorhanden|inklusive|gegeben)(?![\p{L}\p{N}])'
      combo: true
    # "Relocation-Paket", "Umzugskostenzuschuss", "Umzugspauschale"
    - pattern: '(?<![\p{L}\p{N}])(?:relocation[-\s]?(?:support|paket|package|unterstützung|service|budget|pauschale)|umzugs-?(?:zuschuss|pauschale|kosten(?:übernahme|erstattung|zuschuss|pauschale)|hilfe|unterstützung|service|paket|budget|bonus))(?![\p{L}\p{N}])'
      combo: true
    # A list item that is only the noun: "- Visasponsoring", "- Visa-Unterstützung"
    - pattern: '^(?:visa|visum|visums)-?\s*(?:sponsoring|unterstützung)(?:\s+(?:und|&|\+)\s+relocation\p{L}*)?\s*[.!]?$'
      combo: true
      list_item: true
  not_offered:
    no_sponsorship:
      # "Ein Visa-Sponsoring ist leider nicht möglich"
      - pattern: '(?<![\p{L}\p{N}])(?:visa|visum|visums)-?\s*(?:sponsoring|sponsorship|unterstützung)\s+(?:ist|wird|kann)\s+(?:leider\s+|derzeit\s+|aktuell\s+|grundsätzlich\s+)*(?:nicht|kein\p{L}*)(?![\p{L}\p{N}])'
        combo: true
      # "Wir bieten kein Visum-Sponsoring an", "unterstützen wir leider nicht bei Visa-Fragen"
      - '(?<![\p{L}\p{N}])(?:bieten|bietet|können|übernehmen|unterstützen|ermöglichen|sponsern)\s+(?:wir\s+|ihr\s+|dir\s+|ihnen\s+)?(?:leider\s+|derzeit\s+|aktuell\s+)*(?:kein\p{L}*|nicht)(?:\s+[\p{L}\p{N}’''-]+){0,3}?\s+(?:\p{L}*visum\p{L}*|visa\p{L}*|visa-\p{L}+|sponsoring|arbeitserlaubnis|blaue[nr]?\s+karte)(?![\p{L}\p{N}])'
      # "keine Visumsunterstützung"
      - pattern: '(?<![\p{L}\p{N}])kein(?:e|en)?\s+(?:\p{L}*visum\p{L}*|visa-?(?:sponsoring|unterstützung)|visasponsoring|sponsoring\s+(?:für|von)\s+(?:visa|visum|arbeits\p{L}*))(?![\p{L}\p{N}])'
        combo: true
      - pattern: '(?<![\p{L}\p{N}])(?:visa|visum)(?:-?sponsoring|-?unterstützung)?\s*:\s*(?:nein|nicht\s+möglich|kein\p{L}*)(?![\p{L}\p{N}])'
        combo: true
    permit_required:
      # "Eine Arbeitserlaubnis ist Voraussetzung", "Eine gültige Arbeitserlaubnis für Deutschland wird vorausgesetzt"
      - pattern: '(?<![\p{L}\p{N}])(?:arbeitserlaubnis|arbeitsgenehmigung|aufenthalts-?\s*(?:und\s+arbeitserlaubnis|titel|genehmigung))(?:\s+[\p{L}\p{N}-]+){0,4}?\s+(?:ist|wird)\s+(?:zwingend\s+)?(?:voraussetzung|erforderlich|notwendig|vorausgesetzt|zwingend)(?![\p{L}\p{N}])'
        combo: true
      # "Du besitzt eine gültige Arbeitserlaubnis"
      - pattern: '(?<![\p{L}\p{N}])(?:besitzt|besitzen|verfügst\s+über|verfügen\s+über)\s+(?:bereits\s+)?(?:eine\s+)?(?:gültige\s+)?(?:arbeitserlaubnis|arbeitsgenehmigung|aufenthalts-?\s*(?:und\s+arbeitserlaubnis|titel|genehmigung))(?![\p{L}\p{N}])'
        combo: true
      # "Voraussetzung ist eine gültige Arbeitserlaubnis"
      - pattern: '(?<![\p{L}\p{N}])(?:voraussetzung|erforderlich)\s*(?:ist|sind|:)?\s*(?:eine\s+)?(?:gültige\s+)?(?:arbeitserlaubnis|arbeitsgenehmigung|aufenthaltstitel)(?![\p{L}\p{N}])'
        combo: true
      # "Du benötigst eine gültige Arbeitserlaubnis", "Du brauchst eine Arbeitserlaubnis"
      - pattern: '(?<![\p{L}\p{N}])(?:benötigst|brauchst|benötigen|brauchen)\s+(?:du\s+|sie\s+)?(?:bereits\s+)?(?:eine\s+)?(?:gültige\s+)?(?:arbeitserlaubnis|arbeitsgenehmigung|aufenthalts-?\s*(?:und\s+arbeitserlaubnis|titel|genehmigung))(?![\p{L}\p{N}])'
        combo: true
      # "Du musst in Deutschland arbeitsberechtigt sein"
      - pattern: '(?<![\p{L}\p{N}])(?:musst|müssen|solltest|sollten)(?:\s+[\p{L}]+){0,3}?\s+arbeitsberechtigt(?![\p{L}\p{N}])'
        combo: true
  permit_alternatives:
    - '(?<![\p{L}\p{N}])oder(?:\s+[\p{L}\p{N}-]+){0,4}?\s+(?:blaue[nr]?\s+karte|visum|visa|aufenthalts\p{L}*|beantrag\p{L}*)(?![\p{L}\p{N}])'
    - '(?<![\p{L}\p{N}])bei\s+bedarf\s+(?:unterstütz|helfen|hilft|begleit)\p{L}*'
  mention_terms:
    - '(?<![\p{L}\p{N}])(?:visum|visums)(?![\p{L}\p{N}])'
    - pattern: '(?<![\p{L}\p{N}])(?:\p{L}+visum|visums\p{L}+|visa-\p{L}+)(?![\p{L}\p{N}])'
      combo: true
  mention_context:
    - '(?<![\p{L}\p{N}])unterstütz\p{L}*'
    - '(?<![\p{L}\p{N}])blaue[nr]?\s+karte(?![\p{L}\p{N}])'
    - '(?<![\p{L}\p{N}])arbeitserlaubnis(?![\p{L}\p{N}])'
    - '(?<![\p{L}\p{N}])aufenthaltstitel(?![\p{L}\p{N}])'
    - '(?<![\p{L}\p{N}])beantrag\p{L}*'
  negation_cues:
    - nicht
    - 'kein\p{L}*'
    - leider
    - ohne
  clause_breaks:
    - '(?<![\p{L}\p{N}])(?:aber|jedoch|sondern|während|wobei|allerdings|außer)(?![\p{L}\p{N}])'
    - '(?<![\p{L}\p{N}])und\s+(?:wir|du|sie|ihr|es|unser\p{L}*|dein\p{L}*|euer\p{L}*)(?![\p{L}\p{N}])'
  exclude_context:
    - '(?<![\p{L}\p{N}])sponsoring\s+von\s+(?:veranstaltungen|events?|konferenzen)(?![\p{L}\p{N}])'
    - '(?<![\p{L}\p{N}])visa\s*(?:/|,|&|und|oder)\s*(?:master\s*card|amex|american\s+express|maestro|girocard)(?![\p{L}\p{N}])'
    # "Wir unterstützen Unternehmen bei der Relocation ihrer Fachkräfte", "Du unterstützt unser Immigration-Team"
    - '(?<![\p{L}\p{N}])(?:kunden|kundinnen|mandanten|unternehmen|firmen|arbeitgeber|arbeitgebern)\s+(?:bei|mit|im|in)\s+(?:[\p{L}-]+\s+){0,3}?(?:\p{L}*visum|visa|aufenthalt|relocation|umzug|einwanderung|immigration)'
    - '(?<![\p{L}\p{N}])(?:unterstützt|unterstützen|verstärkst|verstärken)\s+(?:unser|unsere|das)\s+\p{L}*(?:immigration|relocation|visa|mobility)\p{L}*[-\s]?team(?![\p{L}\p{N}])'
  abbreviations: [z.B, z, B, ca, inkl, bzw, usw, u.a, d.h, ggf, evtl, nr, z.T, bspw, max, min, std, gmbh, mio, tsd]
  # A quick first look (speed): a JD or sentence with none of these (or of the generic pack's) is skipped. Every phrase the
  # patterns above can match contains one of them; keep it so when you add a pattern.
  prefilter:
    - visum
    - visa
    - sponsor
    - relocat
    - umzug
    - 'blaue[nr]?\s+karte'
    - aufenthalt
    - arbeitserlaubnis
    - arbeitsgenehmigung
    - arbeitsberechtigt
