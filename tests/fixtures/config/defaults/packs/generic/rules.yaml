# 通用规则：英文的公司后缀、中介、合同、地点说法。和用户 pipeline.yaml、当前市场包取并集。

company:
  legal_suffixes:
    - co
    - inc
    - incorporated
    - llc
    - llp
    - ltd
    - limited
    - plc
    - corp
    - corporation
    - sarl
    - sas
    - sa
    - bv
    - nv
    - ab
    - oy
    - srl
    - spa
    - pty
  agency_names:
    - Hays
    - Randstad
    - Adecco
    - Robert Half
    - Michael Page
    - Page Personnel
    - Experis
    - Amoria Bond
    - Darwin Recruitment
    - Harvey Nash
    - Jack & Jill
    - Acceler8 Talent
    - Findr
    - AI Futures
    - Optimus Search
agency:
  company_name_patterns:
    - \brecruit(?:ing|ment|er|ers)?\b
    - \bstaffing\b
    - \bheadhunt
    - \btalent (?:solutions|partners|acquisition)\b
    - \bexecutive search\b
  text_patterns:
    - on behalf of (?:one of )?(?:our|my) (?:\w+ ){0,2}(?:clients?|customers?)
    - on behalf of an? (?:\w+ ){0,2}(?:client|customer)
    - we are recruiting on behalf
    - (?:hiring|recruiting|searching|looking) on behalf of\b
    - our client (?:is|are) (?:a|an|looking)
    - our client,\s+an?\b
    - exclusively (?:retained|engaged|instructed)
    - (?:has|have) been (?:retained|instructed) (?:by|to)\b
    - \b(?:i['’]m|i am) (?:currently )?(?:hiring|recruiting|searching for|looking to (?:hire|recruit))\b
    - \bwe(?:['’]re| are) (?:currently )?(?:supporting|partnering with|representing|working with|helping) (?:a|an|one of) (?:[\w&-]+[ ,]+){0,6}(?:company|startup|start-up|scale-?up|business|firm|organi[sz]ation|client|customer)
    - \brecruitment (?:agency|consultancy|firm)\b
    - \bstaffing (?:agency|firm)\b
    - \bexecutive search (?:firm|consultancy)\b
    - \bheadhunter
    - \bexecutive search\b
  exclude_context_patterns:
    - \bunsolicited\b
    - \b(?:do|does|will|would|can) not (?:accept|consider|respond|reply|take)\b
    - \b(?:don['’]t|doesn['’]t|won['’]t|cannot|can['’]t) (?:accept|consider|respond|reply|take)\b
    - \bno (?:agencies|recruiters|headhunters|agency)\b
    - \bagency submissions?\b
contract:
  student:
    - \bthesis\b
    - \bintern(?:ship)?\b
    - \bworking student\b
  temp_agency:
    - \btemp(?:orary)? (?:agency|staffing)\b
  direct_hire:
    - \b(?:employment type|contract type)\s*:\s*(?:direct hire|direct placement)\b
  freelance:
    - \bfreelanc
    - \bcontractor\b
  fixed_term:
    - \bfixed[- ]term\b
    - \btemporary (?:contract|position|role)\b
    - \btime[- ]limited (?:contract|position)\b
    - \bmaternity (?:cover|leave replacement)\b
    - \b(?:employment|job|contract)[\s-]*(?:type)?\s*:\s*(?:fixed[- ]term|temporary)\b
  permanent:
    - \bpermanent (?:contract|position|role|employment|basis|full[- ]time|employee)\b
    - \bopen[- ]ended (?:contract|employment|position)\b
    - \bemployment[\s-]*type\s*:[^\n:]{0,40}\bregular\b
    - \bindefinite[- ](?:term|period|duration|contract)\b
    - \bcontract(?:ual)? (?:is )?(?:of )?indefinite\b
    - \b(?:employment|job|contract|position)[\s-]*(?:type)?\s*:\s*permanent\b
    - \b(?:employment|job|contract|position)[\s-]*(?:type)?\s*:[^\n:]{0,40}\bpermanent\b
salary:
  currencies:
    - {code: EUR, symbols: [€], words: [eur(?:os?)?]}
    - {code: USD, symbols: [\$], words: [usd]}
    - {code: GBP, symbols: [£], words: [gbp]}
    - {code: CHF, symbols: [sfr\.?], words: [chf]}
    - {code: SEK, symbols: [], words: [sek]}
    - {code: NOK, symbols: [], words: [nok]}
    - {code: DKK, symbols: [], words: [dkk]}
    - {code: PLN, symbols: [zł], words: [pln]}
    - {code: CZK, symbols: [kč], words: [czk]}
filter:
  generic_location_patterns:
    - ^\W*(?:home ?office|homeoffice|multiple locations|various locations|several locations|flexible|remotely in)\W*$
  remote:
    worldwide_patterns:
      - \bworldwide\b
      - \bglobal(?:ly)?\b
      - \banywhere\b

# Signs that a posting is not a real opening (the ghost job check, English; docs/ghost-jobs.md). Only a hint next to the score:
# nothing here changes a score or hides a job. Regex, matched case-insensitively with Unicode: write word boundaries as
# (?<![\p{L}\p{N}]) and (?![\p{L}\p{N}]), not \b. Every entry has an `id` the checks panel names; a pattern in several packs counts once.
ghost:
  # The source's own "reposted" label (LinkedIn: "Reposted 2 weeks ago"). Only channels that report such a label use these.
  repost_label_patterns:
    - id: reposted
      pattern: '(?<![\p{L}\p{N}])re-?posted(?![\p{L}\p{N}])'
  # The JD says the posting is a talent pool or always open, not one opening. Each sentence, list item or short heading + next line
  # is judged on its own. A negation cue (negation_cues) inside the phrase, a few words before it, a few words after it in the same
  # clause, or in the heading of its list cancels it ("This is not a talent pool posting"); `check_negation: false` marks a phrase
  # that is a negation itself. A sentence matching exclude_context does not count, nor does a list item under a duties heading
  # (responsibility_patterns: a recruiter's "- Build our talent pool").
  evergreen_patterns:
    # "This posting is for our talent pool", "Join our talent community", "talent pool requisition", "We are building a talent
    # pool" (first person only: not "Experience building a talent pipeline")
    - id: talent_pool
      pattern: '(?<![\p{L}\p{N}])(?:(?:for|into|join|joining|to|in)\s+(?:our|the)\s+(?:global\s+|future\s+|general\s+)?talent\s+(?:pool|community|network|pipeline)|talent\s+(?:pool|community|pipeline)\s+(?:posting|position|role|requisition|listing|opening|vacancy)|we(?:\s+are|[''’]re|\s+will\s+be)\s+(?:currently\s+|now\s+)?(?:building|growing)\s+(?:a|our)\s+(?:global\s+|future\s+|general\s+)?talent\s+(?:pool|pipeline|community|network))(?![\p{L}\p{N}])'
    # "This is an evergreen role", "evergreen requisition"
    - id: evergreen_posting
      pattern: '(?<![\p{L}\p{N}])evergreen\s+(?:role|position|posting|requisition|req|opening|job|listing|vacancy)(?![\p{L}\p{N}])'
    # "There is no current opening", "This posting is not tied to a specific role"
    - id: no_specific_opening
      pattern: '(?<![\p{L}\p{N}])(?:no|not\s+(?:tied|linked|attached)\s+to\s+(?:a|any|one)|not\s+for\s+(?:a|one|any))\s+(?:current|specific|particular|immediate|concrete|actual|open|active)\s+(?:openings?|positions?|roles?|vacanc(?:y|ies)|jobs?|requisitions?)(?![\p{L}\p{N}])'
      check_negation: false
    # "We are always hiring", "We're always accepting applications" (not "always looking for people who …": the About-us text of
    # many real postings)
    - id: always_hiring
      pattern: '(?<![\p{L}\p{N}])(?:always|continuously|constantly|perpetually)\s+(?:hiring|recruiting|accepting\s+(?:applications|resumes|cvs|candidates))(?![\p{L}\p{N}])'
    # "We collect applications for future openings", "… on a rolling basis for upcoming positions" ("upcoming" only before an
    # opening: not "for upcoming projects")
    - id: future_openings
      pattern: '(?<![\p{L}\p{N}])(?:for|about)\s+(?:our\s+)?(?:(?:potential\s+|upcoming\s+)?future\s+(?:openings|opportunities|vacancies|positions|roles|needs)|upcoming\s+(?:openings|positions|vacancies|roles))(?![\p{L}\p{N}])'
    # "By joining our AI talent pool, you will be contacted … for our future opportunities", "Join our engineering talent community
    # to apply": up to two words before "talent", and only in a sentence with recruiting words (requires_context; "opportunities"
    # only after a job word: not "networking opportunities"): not "Organize events for our engineering talent community",
    # "access to the largest tech talent pool in Europe"
    - id: talent_pool_join
      pattern: '(?<![\p{L}\p{N}])(?:join|joining|for|into)\s+our\s+(?:[\p{L}-]+\s+){0,2}?talent\s+(?:pool|community|network)(?![\p{L}\p{N}])'
      requires_context:
        - '(?<![\p{L}\p{N}])(?:appl(?:y|ying|ied|ications?|icants?)|candidates?|cvs?|resumes?|roles?|positions?|openings?|vacanc(?:y|ies)|hiring|recruit\p{L}*|contacted|(?:job|career|future|new|open|upcoming)\s+opportunit(?:y|ies))(?![\p{L}\p{N}])'
  # A heading that opens the duties of the role. Tested only against heading-shaped lines (short; a "#" heading, ending in ":" or
  # without end punctuation) and "Label:" prefixes, read without "*" / "_" emphasis, list or "#" markers and the emoji or arrows
  # around it, with "&amp;" as "&" and curly apostrophes as straight ones; a final " -" or "—" counts as ":". Right above a list
  # (at most one line of lead-in between) a final "…" or "..." counts as ":" too, and so does a final "?" after one of question_words ("What will I be doing?" / "- …");
  # without a list such a line is a sentence ("Which tasks can our AI automate?"). A list right under a duties heading is the
  # role's duties (evergreen phrases in it do not count).
  responsibility_patterns:
    - id: responsibilities
      pattern: '(?<![\p{L}\p{N}])(?:(?:key|main|core|your|primary|job|role|daily)\s+)?(?:responsibilities|duties|accountabilities|tasks)(?![\p{L}\p{N}])'
    - id: what_you_do
      pattern: '(?<![\p{L}\p{N}])what\s+you[''’]?(?:ll|\s+will)?\s+(?:do|be\s+doing|work\s+on|own|build|achieve)(?![\p{L}\p{N}])'
    - id: the_role
      pattern: '^(?:about\s+)?(?:the|your|this)\s+(?:role|position|job|mission|impact|day|opportunity|challenge)$'
    # "Job Description", "Role overview", "Position summary"
    - id: job_description
      pattern: '(?<![\p{L}\p{N}])(?:job|role|position)\s+(?:description|overview|summary)(?![\p{L}\p{N}])'
    - id: in_this_role
      pattern: '(?<![\p{L}\p{N}])(?:in\s+this\s+(?:role|position)|day[-\s]to[-\s]day|a\s+day\s+in\s+the\s+life)(?![\p{L}\p{N}])'
    # "What will I be doing?", "What you'll be working on", "What you'll be involved in"
    - id: what_you_will_be_doing
      pattern: '(?<![\p{L}\p{N}])(?:what\s+will\s+(?:i|you)\s+(?:be\s+doing|do|work\s+on)|what\s+you(?:[''’]ll|\s+will)\s+be\s+(?:working\s+on|involved\s+in))(?![\p{L}\p{N}])'
    # "Impact you'll make", "The impact you will have", "The impact you bring to Acme", "Your impact"
    - id: your_impact
      pattern: '^(?:your\s+impact|(?:the\s+)?impact\s+you(?:[''’]ll|\s+will)?\s+(?:have|make|bring)(?:\s+to\s+.+)?)$'
    # "Outcomes" as the whole heading
    - id: outcomes
      pattern: '^outcomes$'
    # "You will:", "Within your first 3 months, you will:"
    - id: you_will
      pattern: '^(?:within\s+(?:your|the)\s+first\s+(?:\d+|\p{L}+)\s+(?:days|weeks|months|years?)\s*,?\s+)?you(?:[''’]ll|\s+will)$'
    # "The work you'll do"
    - id: work_you_do
      pattern: '^(?:the\s+)?work\s+you(?:[''’]ll|\s+will)\s+do$'
    # "Your Role – meaningful and rewarding", "THE ROLE & THE TEAM", "Your Role Will Consist Of" (the whole heading: "role"
    # elsewhere in a line is no duties heading)
    - id: the_role_and
      pattern: '^(?:the|your|this)\s+role(?:\s+[–—-]\s+.+|\s+(?:&|and)\s+(?:the\s+|your\s+)?\p{L}+|\s+will\s+consist\s+of)$'
    # "You'll play a key role by…"
    - id: key_role
      pattern: '^you(?:[''’]ll|\s+will)\s+play\s+a\s+key\s+role(?:\s+by)?$'
    # "What awaits you?", "So what's the job", "Your new adventure", "What good looks like"
    - id: role_teasers
      pattern: '^(?:what\s+awaits\s+you|so\s+what(?:[''’]s|\s+is)\s+the\s+job|your\s+new\s+adventure|what\s+good\s+looks\s+like)$'
  # Words that open a question: a heading line ending in "?" is read as a heading ("What will I be doing?") only after one of
  # them (and right above a list), so "Ready to take on new responsibilities?" stays a sentence. Whole words; the packs' lists are united.
  question_words: [what, which, how, who, why, where, when]
  negation_cues:
    - not
    - 'no'
    - never
    - none
    - without
    - cannot
    - 'can[''’]?t'
    - 'don[''’]?t'
    - 'doesn[''’]?t'
    - 'isn[''’]?t'
    - 'aren[''’]?t'
  # Where the clause around an evergreen phrase ends for the negation search: "We have no open role in sales; this posting is for
  # our talent pool" still counts. A comma does not end it, except before "not" ("This posting is for our talent pool, not for a
  # specific team"). "not only / just / merely" is a break, not a negation ("We're always hiring, not only engineers").
  clause_breaks:
    - '[;(]'
    - ',\s*(?=not\s)'
    - '(?<![\p{L}\p{N}])not\s+(?:only|just|merely)(?![\p{L}\p{N}])'
    - '\s[–—]\s'
    - '(?<![\p{L}\p{N}])(?:but|however|although|though|while|whereas|except|instead|rather)(?![\p{L}\p{N}])'
    - '(?<![\p{L}\p{N}])(?:so|and)\s+(?:we|you|they|our|your|there|this)(?![\p{L}\p{N}])'
  # Sentences that mention a talent pool or future roles without saying this posting is one.
  exclude_context:
    # the employer's product, its customers or a team of that name: "talent pool software", "helps companies build their talent
    # pipelines", "Our ATS lets hiring managers add candidates to …", "Our app alerts users about future openings", "Join our Talent
    # Network team as a Recruiter"
    - '(?<![\p{L}\p{N}])talent\s+(?:pool|community|pipeline|network|acquisition)\s+(?:software|platform|management|crm|tools?|solutions?|products?|systems?|features?|teams?|department|managers?|specialists?|leads?|partners?|function)(?![\p{L}\p{N}])'
    - '(?<![\p{L}\p{N}])(?:customers?|clients?|companies|employers|businesses|users|recruiters|hiring\s+managers|teams)(?:[''’]s?)?\s+(?:[\p{L}-]+\s+){0,3}?talent\s+(?:pools?|pipelines?|communit(?:y|ies)|networks?)(?![\p{L}\p{N}])'
    - '(?<![\p{L}\p{N}])(?:our|the|its)\s+(?:ats|apps?|platforms?|software|products?|tools?|crm|solutions?|services?|systems?|marketplace)\s+(?:lets|helps|allows|enables|alerts|notifies|matches|connects|sends|shows|tells|informs)(?![\p{L}\p{N}])'
    # … or as a noun phrase: "Evergreen job listings are a core feature of our ATS", "our platform's talent pool module"
    - '(?<![\p{L}\p{N}])(?:(?:features?|modules?|capabilit(?:y|ies)|functionality|components?)\s+(?:of|in)\s+(?:our|the|its|their|an?)\s+(?:[\p{L}-]+\s+)?(?:ats|apps?|platforms?|software|products?|tools?|crm|solutions?|services?|systems?|marketplace)|(?:our|the|its|their)\s+(?:ats|app|platform|software|product|tool|crm|solution|service|system)[''’]s?\s+(?:[\p{L}-]+\s+){0,3}?(?:features?|modules?|capabilit(?:y|ies)|functionality))(?![\p{L}\p{N}])'
    # the posting says it is a real opening after all: "…, but this role is a concrete opening", "this role is based in Berlin"
    - '(?<![\p{L}\p{N}])(?:this|the)\s+(?:role|position|job|posting|vacancy|opening)\s+is\s+(?:an?\s+)?(?:concrete|real|specific|actual|genuine|existing|based|located)(?![\p{L}\p{N}])'
    # a duty of the role: "You will build and nurture our talent pipeline", "help us grow our talent pool", "responsible for our
    # talent pool", "Build our talent community" (the verb opens the sentence). Not "We are building a talent pool": that is the posting,
    # nor "Help us grow by joining our engineering talent pool" (no "join", "apply" or "by" in between).
    - '(?<![\p{L}\p{N}])(?:(?:you(?:[''’]ll|[''’]re|[''’]d|\s+will|\s+would|\s+are|\s+can|\s+should)?|help(?:s|ing)?(?:\s+us)?(?:\s+to)?)\s+(?:also\s+|actively\s+|be\s+)?(?:build|building|grow|growing|manage|managing|maintain|maintaining|nurture|nurturing|develop|developing|own|owning|source|sourcing|engage|engaging|support|supporting|expand|expanding)|responsible\s+for)\s+(?:(?!(?:join|joining|apply|applying|by)(?![\p{L}\p{N}]))[\p{L}''’-]+\s+){0,5}?talent\s+(?:pools?|pipelines?|communit(?:y|ies)|networks?)(?![\p{L}\p{N}])'
    - '^[\s*•·–-]*(?:build|building|grow|growing|manage|managing|maintain|maintaining|nurture|nurturing|develop|developing|own|owning|source|sourcing|engage|engaging|support|supporting|expand|expanding)\s+(?:(?!(?:join|joining|apply|applying|by)(?![\p{L}\p{N}]))[\p{L}''’-]+\s+){0,5}?talent\s+(?:pools?|pipelines?|communit(?:y|ies)|networks?)(?![\p{L}\p{N}])'
    # a recruiter's duty: "You will source candidates for upcoming roles"
    - '(?<![\p{L}\p{N}])you(?:[''’]ll|[''’]re|[''’]d|\s+will|\s+would|\s+are|\s+can)?\s+(?:also\s+)?(?:hire|hiring|recruit\p{L}*|source|sourcing|screen\p{L}*|interview\p{L}*|staff\p{L}*|plan|planning|forecast\p{L}*|partner\p{L}*|identify|identifying|attract\p{L}*|find|finding)\s+(?:[\p{L}''’-]+\s+){0,4}?(?:for|about)\s+(?:our\s+)?(?:potential\s+|upcoming\s+)?(?:future|upcoming)(?![\p{L}\p{N}])'
    # a recruiter's duty for a talent pool: "You will screen applicants for our engineering talent pool", "Identify and attract
    # candidates for our engineering talent pool", "Your job: build relationships with candidates for our tech talent pool" (the verb
    # opens the sentence or follows "you" / "Your job:"). Not "We are hiring for our AI talent pool", "Hiring for our AI talent pool:
    # apply now" (no "hire" or "recruit" opening the sentence), "you will be placed into our AI talent pool", "Find out how to apply
    # for our AI talent pool".
    - '(?:^[\s*•·–-]*(?!hir|recruit)|(?<![\p{L}\p{N}])(?:you(?:[''’]ll|[''’]re|[''’]d|\s+will|\s+would|\s+are|\s+can|\s+should)?\s+(?:also\s+|actively\s+)?|(?:job|role|tasks?|duties|focus|mission)\s*:\s*))(?:screen|recruit|interview|identif|attract|hir|assess|evaluat|plac|find|sourc|engag|build|grow|manag|maintain|nurtur|develop|own|support|expand)\p{L}*\s+(?:(?!(?:join|joining|apply|applying|by)(?![\p{L}\p{N}]))[\p{L}''’-]+\s+){0,4}?(?:for|into)\s+our\s+(?:[\p{L}-]+\s+){0,2}?talent\s+(?:pools?|communit(?:y|ies)|networks?)(?![\p{L}\p{N}])'
    # training for later roles is a benefit, not an opening: "Mentoring for future roles in leadership"
    - '(?<![\p{L}\p{N}])(?:training|mentoring|coaching|career|learning|upskilling|development|preparation|prepares?|preparing|readiness)\s+(?:[\p{L}''’-]+\s+){0,3}?(?:for|towards?|into)\s+(?:our\s+)?(?:potential\s+|upcoming\s+)?(?:future|upcoming)(?![\p{L}\p{N}])'
    # events and training for a community, not this posting: "Organize events for our engineering talent community", "We run
    # workshops for our internal talent community", "Join our AI talent community meetups", "Join our engineering talent community
    # for networking opportunities and events" (not "This program is for our talent pool: apply now")
    - '(?<![\p{L}\p{N}])(?:events?|workshops?|meetups?|webinars?|hackathons?|trainings?|mentoring|newsletters?)\s+(?:[\p{L}''’-]+\s+){0,3}?(?:for|in|into|with|across)\s+our\s+(?:[\p{L}-]+\s+){0,2}?talent\s+(?:pools?|communit(?:y|ies)|networks?)(?![\p{L}\p{N}])'
    - '(?<![\p{L}\p{N}])talent\s+(?:pools?|communit(?:y|ies)|networks?)\s+(?:[\p{L}''’-]+\s+){0,3}?(?:events?|workshops?|meetups?|webinars?|hackathons?|networking|mentoring|newsletters?)(?![\p{L}\p{N}])'
    # the footer of a real posting: "Don't see a role that fits? Join our talent community", "If none of our roles fit …"
    - '(?<![\p{L}\p{N}])(?:don[''’]?t|do\s+not|didn[''’]?t|can[''’]?t|cannot|couldn[''’]?t)\s+(?:see|find)(?![\p{L}\p{N}])'
    - '(?<![\p{L}\p{N}])(?:none\s+of\s+(?:our|the|these)|no)\s+(?:suitable|matching|relevant|right|fitting)\s+(?:roles?|positions?|jobs?|openings?|vacanc(?:y|ies))(?![\p{L}\p{N}])'
    - '(?<![\p{L}\p{N}])(?:if|in\s+case|should|whether)\s+(?:[\p{L}''’-]+\s+){0,6}?(?:no|none|not|don[''’]?t|doesn[''’]?t|isn[''’]?t|aren[''’]?t|can[''’]?t)(?![\p{L}\p{N}])'
    # a newsletter-style footer: "Not ready to apply? Join our talent community to stay in touch", "Want to hear about new roles?"
    - '(?<![\p{L}\p{N}])(?:not\s+(?:yet\s+)?ready\s+to\s+apply|(?:want|like|wish)\s+to\s+(?:hear|know|learn|be\s+(?:notified|informed|the\s+first))\s+(?:about|when|of)|stay\s+(?:in\s+touch|connected|informed|up\s+to\s+date)|keep\s+in\s+touch|(?:job|career)\s+alerts?)(?![\p{L}\p{N}])'
    # privacy notes and "your application may also be considered for future roles"
    - '(?<![\p{L}\p{N}])(?:privacy|gdpr|data\s+protection|personal\s+data|consent|retain|retention|on\s+file|keep\s+your|store\s+your|delete)(?![\p{L}\p{N}])'
    - '(?<![\p{L}\p{N}])also\s+(?:be\s+)?(?:consider\p{L}*|kept|keep|use|used|added)(?![\p{L}\p{N}])'
    - '(?<![\p{L}\p{N}])(?:may|might|will|would|can)\s+(?:also\s+)?(?:contact|reach\s+out\s+to|notify)\s+you(?![\p{L}\p{N}])'
  # The question right before a sentence is read with it ("Don't see a role that fits? Join our talent community"): the text before
  # the sentence ends in one of `ends`; the question starts after the last of `starts` (or a line break). line_above: the question
  # may stand on the line above. A sentence that itself ends in one of `ends` is a question, not a statement about the posting
  # ("Always hiring? Acme automates your sourcing"), and does not count. Plain characters; the packs' lists are united.
  lead_in_question:
    ends: ['?', '？']
    starts: ['.', '!', '?', '？', '¿', '¡', '。', '！']
    line_above: true
  abbreviations: [e.g, i.e, etc, incl, approx, vs, inc, ltd, co, corp, mr, ms, dr]
  # A quick first look (speed): a JD or sentence with none of these is not searched for evergreen phrases. Every phrase the
  # evergreen patterns can match contains one of them; keep it so when you add a pattern (pnpm config:check warns).
  prefilter:
    - talent
    - evergreen
    - '(?:always|continuously|constantly|perpetually)'
    - future
    - upcoming
    - '(?:current|specific|particular|immediate|concrete|actual|open|active)'

visa:
  # Support is mentioned: "We offer visa sponsorship and relocation support", "Visa sponsorship is available".
  # A negation cue (negation_cues) inside it, a few words before it ("We do not offer …") or a few words after it in the same clause
  # ("Relocation support is not available", "Relocation support: No") makes the sentence unclear, never "offered". The word counts
  # are pipeline.yaml job_checks.visa.negation_words_before / _after; clause_breaks end the clause.
  offered:
    - pattern: '(?<![\p{L}\p{N}])(?:offer(?:s|ing)?|provid(?:e|es|ing)|sponsor(?:s|ing)?|support(?:s|ing)?|assist(?:s|ing)?|help(?:s|ing)?|cover(?:s|ing)?|includ(?:e|es|ing)|incl\.)(?:\s+[\p{L}\p{N}’''-]+){0,5}?\s+(?:visa\s+(?:sponsorship|support|process(?:es)?|applications?)|work\s+(?:permits?|visas?)|(?:eu\s+)?blue\s+card|relocation|immigration)(?![\p{L}\p{N}])'
      combo: true
    - pattern: '(?<![\p{L}\p{N}])sponsor(?:s|ing)?\s+(?:your\s+|a\s+|the\s+|their\s+)?(?:visas?|work\s+permits?)(?![\p{L}\p{N}])'
      combo: true
    - pattern: '(?<![\p{L}\p{N}])(?:visa|immigration|work\s+permit|relocation)(?:\s+(?:and|&|/)\s+(?:visa|immigration|work\s+permit|relocation))?\s+(?:sponsorship|support|assistance|help)\s+(?:is\s+|are\s+|will\s+be\s+)?(?:available|provided|offered|included|possible)(?![\p{L}\p{N}])'
      combo: true
    - pattern: '(?<![\p{L}\p{N}])relocation\s+(?:support|package|assistance|bonus|budget|allowance)(?![\p{L}\p{N}])'
      combo: true
    # "Relocation is covered"; "Relocation is not offered" carries its negation inside and so counts as unclear
    - pattern: '(?<![\p{L}\p{N}])relocation\s+(?:is|will\s+be)\s+(?:not\s+)?(?:available|provided|offered|included|possible|covered|supported)(?![\p{L}\p{N}])'
      combo: true
    - pattern: '(?<![\p{L}\p{N}])(?:visa|immigration)\s+(?:sponsorship|support)\s*:\s*(?:yes|available|provided|offered)(?![\p{L}\p{N}])'
      combo: true
    # A list item that is only the noun: "- Visa sponsorship"
    - pattern: '^(?:visa|immigration)\s+(?:sponsorship|support|assistance)(?:\s+(?:and|&|\+)\s+relocation(?:\s+(?:support|package|assistance))?)?\s*[.!]?$'
      combo: true
      list_item: true
  not_offered:
    # It says there is no sponsorship: "Visa sponsorship is not available", "We are unable to offer sponsorship".
    no_sponsorship:
      - pattern: '(?<![\p{L}\p{N}])sponsorship\s+(?:is\s+|will\s+)?(?:not\s+(?:be\s+)?|no\s+longer\s+|un)(?:available|provided|offered|possible)(?![\p{L}\p{N}])'
        combo: true
      - pattern: '(?<![\p{L}\p{N}])(?:(?:unable|not\s+able|not\s+in\s+a\s+position)\s+to|cannot|can[''’]?t|can\s+not|do(?:es)?\s+not|don[''’]?t|doesn[''’]?t|will\s+not|won[''’]?t|(?:are|is)\s+not)\s+(?:currently\s+|presently\s+|yet\s+)?(?:offer|provide|sponsor|support)(?:\s+[\p{L}\p{N}’''-]+){0,4}?\s+(?:sponsorships?|visa\s+(?:sponsorship|support|applications?)|work\s+(?:permits?|visas?))(?![\p{L}\p{N}])'
        combo: true
      - '(?<![\p{L}\p{N}])(?:(?:unable|not\s+able|not\s+in\s+a\s+position)\s+to|cannot|can[''’]?t|can\s+not|do(?:es)?\s+not|don[''’]?t|doesn[''’]?t|will\s+not|won[''’]?t)\s+(?:currently\s+|presently\s+)?(?:sponsor|support)\s+(?:your\s+|a\s+|any\s+)?visas?(?![\p{L}\p{N}])'
      - pattern: '(?<![\p{L}\p{N}])(?:visa\s+|immigration\s+)?sponsorship\s*:\s*(?:no|none|not\s+(?:available|offered|provided)|n/?a)(?![\p{L}\p{N}])'
        combo: true
      - pattern: '(?<![\p{L}\p{N}])no\s+(?:visa\s+|immigration\s+)?sponsorship(?![\p{L}\p{N}])'
        combo: true
    # It requires a permit the candidate already has: "You must hold a valid work permit", "eligible to work in the EU without sponsorship".
    permit_required:
      - pattern: '(?<![\p{L}\p{N}])(?:must|need\s+to|needs\s+to|should|required\s+to)\s+(?:already\s+)?(?:have|hold|possess|be\s+in\s+possession\s+of)\s+(?:a\s+|an\s+|the\s+)?(?:valid\s+|existing\s+|current\s+)?(?:(?:eu|eea|german|uk|us)\s+)?(?:work(?:ing)?\s+(?:permit|authori[sz]ation|visa)|right\s+to\s+work|residence\s+permit)(?![\p{L}\p{N}])'
        combo: true
      - pattern: '(?<![\p{L}\p{N}])(?:must|need\s+to|needs\s+to|should)\s+(?:already\s+)?be\s+(?:legally\s+)?(?:eligible|authori[sz]ed|permitted|allowed|entitled)\s+to\s+work(?![\p{L}\p{N}])'
        combo: true
      - pattern: '(?<![\p{L}\p{N}])(?:eligible|authori[sz]ed|permitted|allowed|entitled)\s+to\s+work(?:\s+[\p{L}\p{N}’''-]+){0,5}?\s+without\s+(?:(?:visa|employer|company|any)\s+)?sponsorship(?![\p{L}\p{N}])'
        combo: true
      - pattern: '(?<![\p{L}\p{N}])you\s+(?:already\s+)?(?:hold|have|possess)\s+(?:a\s+|an\s+)?(?:valid\s+|existing\s+)(?:work(?:ing)?\s+(?:permit|authori[sz]ation|visa)|residence\s+permit|right\s+to\s+work)(?![\p{L}\p{N}])'
        combo: true
      - pattern: '(?<![\p{L}\p{N}])(?:work(?:ing)?\s+permit|right\s+to\s+work|work\s+authori[sz]ation)(?:\s+(?:for|in)(?:\s+[\p{L}]+){1,3}?)?\s+(?:is\s+)?(?:required|mandatory|a\s+must|a\s+requirement|essential)(?![\p{L}\p{N}])'
        combo: true
      - pattern: '(?<![\p{L}\p{N}])only\s+(?:candidates|applicants|applications)\s+(?:with|who\s+(?:have|hold|already\s+have))\s+(?:a\s+|an\s+)?(?:valid\s+|existing\s+)?(?:work(?:ing)?\s+permits?|right\s+to\s+work|work\s+authori[sz]ation)(?![\p{L}\p{N}])'
        combo: true
  # Next to a permit_required phrase these make the sentence unclear, not a refusal: "… or are eligible for an EU Blue Card".
  permit_alternatives:
    - '(?<![\p{L}\p{N}])or\s+(?:are\s+|be\s+)?(?:eligible|qualify|qualified)\s+(?:for|to\s+(?:obtain|apply))(?![\p{L}\p{N}])'
    - '(?<![\p{L}\p{N}])or\s+(?:can|could|are\s+able\s+to)\s+(?:obtain|get|apply\s+for|receive)(?![\p{L}\p{N}])'
    - '(?<![\p{L}\p{N}])or\s+(?:an?\s+)?(?:eu\s+)?blue\s+card(?![\p{L}\p{N}])'
    - '(?<![\p{L}\p{N}])(?:we|will)\s+(?:support|help|assist)\s+(?:you\s+)?(?:with\s+)?(?:the\s+)?(?:visa|blue\s+card|application|process)(?![\p{L}\p{N}])'
  # A visa word next to a context word in the same sentence, with nothing above matching: a mention the rules cannot judge.
  mention_terms:
    - '(?<![\p{L}\p{N}])visas?(?![\p{L}\p{N}])'
  mention_context:
    - '(?<![\p{L}\p{N}])sponsor\p{L}*'
    - '(?<![\p{L}\p{N}])support\p{L}*'
    - '(?<![\p{L}\p{N}])blue\s+card(?![\p{L}\p{N}])'
    - '(?<![\p{L}\p{N}])work\s+permits?(?![\p{L}\p{N}])'
    - '(?<![\p{L}\p{N}])relocat\p{L}*'
    - '(?<![\p{L}\p{N}])immigration(?![\p{L}\p{N}])'
  # Whole words that negate an "offered" phrase.
  negation_cues:
    - not
    - 'no'
    - unable
    - cannot
    - 'can[''’]?t'
    - 'won[''’]?t'
    - 'don[''’]?t'
    - 'doesn[''’]?t'
    - without
    - never
    - none
  # Where the clause after an "offered" phrase ends for the negation search: "Visa sponsorship is available, but not for interns"
  # still counts. A comma or colon does not end it ("Relocation support: No").
  clause_breaks:
    - '[;(]'
    - '\s[–—]\s'
    - '(?<![\p{L}\p{N}])(?:but|however|although|though|while|whereas|except)(?![\p{L}\p{N}])'
    - '(?<![\p{L}\p{N}])and\s+(?:we|you|they|our|your|there)(?![\p{L}\p{N}])'
  # Sentences about payment cards, or about the employer's product or customers, not the candidate's visa.
  exclude_context:
    - '(?<![\p{L}\p{N}])visa\s*(?:/|,|&|and|or)\s*(?:master\s*card|amex|american\s+express|maestro|discover)(?![\p{L}\p{N}])'
    - '(?<![\p{L}\p{N}])(?:master\s*card|amex|american\s+express|maestro)\s*(?:/|,|&|and|or)\s*visa(?![\p{L}\p{N}])'
    - '(?<![\p{L}\p{N}])visa\s+(?:cards?|payments?|network|direct|checkout|credentials?|transactions?)(?![\p{L}\p{N}])'
    # "We help our customers with visa applications", "helps companies with employee relocation"
    - '(?<![\p{L}\p{N}])(?:customers?|clients?|companies|employers|businesses|merchants?|users)\s+(?:with|in|on)\s+(?:[\p{L}-]+\s+){0,3}?(?:visa|immigration|relocation)'
    # "You will support our immigration team", "the relocation of client employees", "immigration compliance"
    - '(?<![\p{L}\p{N}])(?:support|join|work\s+with|lead|manage)\s+(?:our|the|a)\s+(?:[\p{L}-]+\s+)?(?:immigration|relocation|mobility|visa)\s+team(?![\p{L}\p{N}])'
    - '(?<![\p{L}\p{N}])relocation\s+of\s+(?:[\p{L}-]+\s+){0,2}?(?:employees|staff|workers|people)(?![\p{L}\p{N}])'
    - '(?<![\p{L}\p{N}])(?:immigration|visa|relocation)\s+(?:compliance|software|platform|services?\s+(?:provider|company|firm))(?![\p{L}\p{N}])'
  # A company whose name is a visa word (normalized name, as in companies.name_norm).
  exclude_companies:
    - '^visa(?:-|$)'
  abbreviations: [e.g, i.e, etc, incl, approx, vs, inc, ltd, co, corp, mr, ms, dr]
  # A quick first look (speed): a JD or sentence with none of these is skipped. Every phrase the patterns above can match
  # contains one of them; keep it so when you add a pattern.
  prefilter:
    - visa
    - sponsor
    - permit
    - relocat
    - immigration
    - 'blue\s+card'
    - 'authori[sz]'
    - 'right\s+to\s+work'
    - '(?:eligible|allowed|entitled)\s+to\s+work'
