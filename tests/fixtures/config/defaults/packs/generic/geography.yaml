# 通用地理：世界国家表、命名区域、欧洲城市表、州代码。
# pattern 写了就用它（正则，大小写不敏感），否则按 name + aliases 整词匹配；match: false 的国家不从文字里认（名字容易误判）。
# cities：地点里的写法 -> [规范名, 国家]。规范名是去重键的一部分，不要改。

countries:
  - {code: GB, name: United Kingdom, aliases: [UK, Great Britain, England, Scotland, Wales, Northern Ireland], indeed: uk, pattern: northern ireland|\b(?:united kingdom|great britain|england|scotland|wales)\b|\buk\b}
